<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agrideepai – AI for Agriculture</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="/logo.png" alt="agrideepai" class="logo-img" />
          <span class="brand-name">agrideepai</span>
        </div>
        <button id="sidebarToggle" class="icon-button" aria-label="Toggle sidebar">
          <i data-lucide="panel-left-close"></i>
          <i data-lucide="panel-left-open" style="display:none;"></i>
        </button>
      </div>

      <button id="newChatBtn" class="new-chat-btn">
        <i data-lucide="square-pen"></i>
        <span>New Chat</span>
      </button>

      <div id="chatList" class="chat-history"></div>

      <div class="sidebar-footer">
        <button id="authSidebarBtn" class="auth-btn">
          <i data-lucide="log-in"></i>
          <span>Sign In</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat -->
    <main id="mainContent" class="chat-layout">
      <header id="topBar">
        <button id="openSidebarBtn" class="icon-button" aria-label="Open sidebar">
          <i data-lucide="menu"></i>
        </button>
        <!-- No chat title -->
      </header>

      <div id="chatContainer">
        <div id="welcomeScreen">
          <img src="/logo.png" alt="agrideepai" class="welcome-logo" />
          <h1>How can I help today?</h1>
          <p>Ask about agriculture, livestock, and more.</p>
          <div class="suggestion-chips">
            <button class="chip" data-prompt="Diagnose crop symptoms">🌿 Diagnose crop symptoms</button>
            <button class="chip" data-prompt="Ask about livestock">🐄 Ask about livestock</button>
            <button class="chip" data-prompt="Improve crop yield">📈 Improve crop yield</button>
            <button class="chip" data-prompt="Plan a farm">🧑‍🌾 Plan a farm</button>
          </div>
        </div>
        <div id="messageList"></div>
      </div>

      <footer id="composerArea">
        <div id="composer">
          <div id="attachmentPreview"></div>
          <div class="composer-main">
            <button id="attachBtn" class="icon-button" aria-label="Attach file">
              <i data-lucide="paperclip"></i>
            </button>
            <textarea id="messageInput" rows="1" placeholder="Ask about agriculture or livestock..."></textarea>
            <button id="sendBtn" class="send-button" aria-label="Send message">
              <i data-lucide="send" class="send-icon"></i>
              <i data-lucide="square" class="stop-icon" style="display:none;"></i>
            </button>
          </div>
        </div>
        <div class="footer-note">AgriDeepAI can make a mistake. Check for reference.</div>
      </footer>
    </main>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="authModalBody"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div id="shareModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="shareModalClose">&times;</button>
      <h2>Share Chat</h2>
      <p id="shareLinkDisplay" style="word-break:break-all; background:var(--surface); padding:0.5rem; border-radius:var(--radius-sm);"></p>
      <button id="copyShareLink" class="btn-primary">Copy Link</button>
    </div>
  </div>

  <!-- Chat Context Menu -->
  <div id="chatMenu" class="context-menu hidden">
    <button data-action="pin"><i data-lucide="pin"></i> Pin</button>
    <button data-action="share"><i data-lucide="share-2"></i> Share</button>
    <button data-action="rename"><i data-lucide="pencil"></i> Rename</button>
    <button data-action="delete" style="color:var(--danger);"><i data-lucide="trash-2"></i> Delete</button>
  </div>

  <script src="main.js" type="module"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
    window.refreshIcons = () => lucide.createIcons();
  </script>
</body>
</html>
