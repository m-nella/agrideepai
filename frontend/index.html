<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriDeepAI – Smart AI for Agriculture &amp; Livestock</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="description" content="AgriDeepAI – free AI assistant for agriculture, livestock, crop farming, and agribusiness." />
  <meta property="og:title" content="AgriDeepAI – Smart AI for Agriculture &amp; Livestock" />
  <meta property="og:description" content="Free AI assistant for farmers, students, and agribusiness – ask about crops, animals, soil, and more." />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AgriDeepAI",
    "url": "https://agrideepai.agentdomains.co/",
    "description": "AgriDeepAI – free AI assistant for agriculture and livestock.",
    "applicationCategory": "AI Assistant",
    "operatingSystem": "All",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Ornella Mutuyimana" },
    "creator": { "@type": "Person", "name": "Ornella Mutuyimana" }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <img src="/logo.png" alt="AgriDeepAI" class="logo-img" />
          <span class="logo-text">AgriDeepAI</span>
        </div>
        <button id="closeSidebarBtn" aria-label="Close sidebar">✕</button>
      </div>
      <button id="newChatBtn" class="new-chat-btn">➕ New Chat</button>
      <div id="chatList"></div>
      <div class="sidebar-footer">
        <button id="authSidebarBtn">Sign In</button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main id="mainContent">
      <header id="topBar">
        <button id="openSidebarBtn" aria-label="Open sidebar">☰</button>
        <span id="chatTitle">AgriDeepAI</span>
      </header>

      <div id="chatContainer">
        <div id="welcomeScreen">
          <img src="/logo.png" alt="AgriDeepAI" class="welcome-logo" />
          <h1>How can I help with agriculture today?</h1>
          <div class="suggestion-chips">
            <button class="chip" data-prompt="Diagnose crop symptoms">🌿 Diagnose crop symptoms</button>
            <button class="chip" data-prompt="Ask about livestock">🐄 Ask about livestock</button>
            <button class="chip" data-prompt="Improve crop yield">📈 Improve crop yield</button>
            <button class="chip" data-prompt="Plan a farm">🧑‍🌾 Plan a farm</button>
          </div>
        </div>
        <div id="messageList"></div>
      </div>

      <footer id="composerArea">
        <div id="composer">
          <button id="attachBtn" aria-label="Attach file">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="Ask about agriculture or livestock..."></textarea>
          <button id="sendBtn" aria-label="Send">
            <svg class="send-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            <svg class="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <div class="footer-note">AgriDeepAI can make a mistake. Check for reference.</div>
      </footer>
    </main>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="authModalBody"></div>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
