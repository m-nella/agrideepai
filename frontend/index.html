<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>AgriDeepAI – Smart AI for Agriculture &amp; Livestock</title>
  <meta name="title" content="AgriDeepAI – Smart AI for Agriculture &amp; Livestock" />
  <meta name="description" content="AgriDeepAI is a free, intelligent AI assistant specialized in agriculture, livestock, crop farming, plant health, soil management, and agribusiness – with focus on Rwanda and Africa." />
  <meta name="keywords" content="AgriDeepAI, agriculture AI, livestock assistant, crop disease diagnosis, farming advice, Rwanda agriculture, African farming, agribusiness, AI for farmers" />
  <link rel="canonical" href="https://agrideepai.agentdomains.co/" />

  <!-- Favicon -->
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://agrideepai.agentdomains.co/" />
  <meta property="og:title" content="AgriDeepAI – Smart AI for Agriculture &amp; Livestock" />
  <meta property="og:description" content="Free AI assistant for farmers, students, and agribusiness – ask about crops, animals, soil, and more." />
  <meta property="og:image" content="https://agrideepai.agentdomains.co/logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://agrideepai.agentdomains.co/" />
  <meta property="twitter:title" content="AgriDeepAI – Smart AI for Agriculture &amp; Livestock" />
  <meta property="twitter:description" content="Free AI assistant for agriculture, livestock, and agribusiness – powered by Google Gemini." />
  <meta property="twitter:image" content="https://agrideepai.agentdomains.co/logo.png" />

  <!-- JSON‑LD Structured Data (for rich results) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AgriDeepAI",
    "url": "https://agrideepai.agentdomains.co/",
    "description": "AgriDeepAI is a free, intelligent AI assistant specialized in agriculture, livestock, crop farming, plant health, soil management, and agribusiness – with strong focus on Rwanda and Africa.",
    "applicationCategory": "AI Assistant",
    "operatingSystem": "All",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "Ornella Mutuyimana"
    },
    "creator": {
      "@type": "Person",
      "name": "Ornella Mutuyimana"
    }
  }
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="closed">
      <div class="sidebar-header">
        <div class="logo">
          <img src="/logo.png" alt="AgriDeepAI" class="logo-img" />
          <span class="logo-text">AgriDeepAI</span>
        </div>
        <button id="closeSidebarBtn" aria-label="Close sidebar">✕</button>
      </div>
      <button id="newChatBtn" class="new-chat-btn">➕ New Chat</button>
      <div id="chatList"></div>
      <div class="sidebar-footer">
        <button id="authSidebarBtn">Sign In</button>
        <button id="themeSidebarBtn">🌓</button>
      </div>
    </aside>

    <!-- Main -->
    <main id="mainContent">
      <header id="topBar">
        <button id="openSidebarBtn" aria-label="Open sidebar">☰</button>
        <span id="chatTitle">AgriDeepAI</span>
        <div class="top-actions">
          <button id="themeTopBtn">🌓</button>
          <button id="authTopBtn">Sign In</button>
        </div>
      </header>

      <div id="chatContainer">
        <div id="welcomeScreen">
          <img src="/logo.png" alt="AgriDeepAI" class="welcome-logo" />
          <h1>How can I help with agriculture today?</h1>
          <div class="suggestion-chips">
            <button class="chip" data-prompt="Diagnose crop symptoms">🌿 Diagnose crop symptoms</button>
            <button class="chip" data-prompt="Ask about livestock">🐄 Ask about livestock</button>
            <button class="chip" data-prompt="Improve crop yield">📈 Improve crop yield</button>
            <button class="chip" data-prompt="Plan a farm">🧑‍🌾 Plan a farm</button>
          </div>
        </div>
        <div id="messageList"></div>
      </div>

      <footer id="composerArea">
        <div id="composer">
          <button id="attachBtn" aria-label="Attach file">📎</button>
          <textarea id="messageInput" rows="1" placeholder="Ask about agriculture or livestock..."></textarea>
          <button id="sendBtn" aria-label="Send">➤</button>
        </div>
        <div class="footer-note">AgriDeepAI – AI for Agriculture &amp; Livestock</div>
      </footer>
    </main>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <div id="authModalBody">
        <!-- dynamically filled -->
      </div>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
