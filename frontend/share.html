<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#171b20" />
  <meta name="description" content="Shared chat on AgriDeepAI" />
  <title>Shared Chat — AgriDeepAI</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --background: #171b20;
      --surface: #1e232a;
      --surface-hover: #252c34;
      --border: rgba(255,255,255,0.09);
      --text: #edf1f5;
      --text-muted: #98a2ad;
      --accent: #2f8f46;
      --accent-dim: rgba(47, 143, 70, 0.25);
      --danger: #e85d5d;
      --radius-md: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .85rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .header-left img { height: 28px; width: auto; }
    .header-title { font-weight: 700; font-size: .95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-sub { color: var(--text-muted); font-size: .75rem; font-weight: 400; }
    .header-cta {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: .5rem .9rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .header-cta:hover { background: #3ca457; }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    #shareStatus {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    #shareStatus.error { color: var(--danger); }
    .msg-row { display: flex; flex-direction: column; width: 100%; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }
    .msg-header {
      display: flex; align-items: center; gap: .4rem;
      margin-bottom: .25rem; font-size: .85rem; font-weight: 600;
      color: var(--text);
    }
    .msg-header img { height: 20px; width: auto; border-radius: 4px; }
    .msg-bubble {
      max-width: min(780px, 85%);
      padding: .65rem 1rem;
      border-radius: var(--radius-md);
      line-height: 1.65;
      word-wrap: break-word;
      font-size: .95rem;
    }
    .msg-bubble.user {
      background: var(--accent-dim);
      border: 1px solid rgba(255,255,255,.06);
      border-bottom-right-radius: 4px;
      color: var(--text);
      white-space: pre-wrap;
    }
    .msg-bubble.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
      width: 100%;
    }
    .msg-bubble.assistant h1, .msg-bubble.assistant h2, .msg-bubble.assistant h3 { margin: .6rem 0 .3rem; font-weight: 600; }
    .msg-bubble.assistant h1 { font-size: 1.3rem; }
    .msg-bubble.assistant h2 { font-size: 1.15rem; }
    .msg-bubble.assistant h3 { font-size: 1rem; }
    .msg-bubble.assistant p { margin: .25rem 0; }
    .msg-bubble.assistant ul, .msg-bubble.assistant ol { padding-left: 1.2rem; margin: .25rem 0; }
    .msg-bubble.assistant li { margin: .15rem 0; }
    .msg-bubble.assistant code { background: var(--surface-hover); padding: .05rem .3rem; border-radius: 4px; font-family: monospace; font-size: .9em; }
    .msg-bubble.assistant pre { background: var(--surface-hover); padding: .5rem; border-radius: 10px; overflow-x: auto; }
    .msg-bubble.assistant table { border-collapse: collapse; width: 100%; margin: .4rem 0; font-size: .9em; display: block; overflow-x: auto; }
    .msg-bubble.assistant th, .msg-bubble.assistant td { border: 1px solid var(--border); padding: .25rem .5rem; text-align: left; }
    .msg-bubble.assistant th { background: var(--surface-hover); }
    .msg-bubble.assistant blockquote { border-left: 3px solid var(--accent); padding-left: .6rem; margin: .3rem 0; color: var(--text-muted); }
    .msg-bubble.assistant hr { display: none; }
    @media (max-width: 480px) {
      .msg-bubble { max-width: 92%; padding: .55rem .85rem; font-size: .92rem; }
      main { padding: 1rem .75rem 2.5rem; }
      header { padding: .7rem .75rem; }
      .header-title { font-size: .85rem; }
      .header-cta { padding: .45rem .75rem; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="/logo.png" alt="agrideepai" />
      <div>
        <div class="header-title">Shared Chat</div>
        <div class="header-sub">via AgriDeepAI</div>
      </div>
    </div>
    <a class="header-cta" href="/">Open AgriDeepAI</a>
  </header>
  <main>
    <div id="shareStatus">Loading shared chat…</div>
    <div id="shareMessages"></div>
  </main>
  <script src="share.js"></script>
</body>
</html>
