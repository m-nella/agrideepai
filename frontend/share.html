<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="theme-color" content="#171b20" />
  <meta name="description" content="Shared chat on AgriDeepAI" />
  <title>Shared Chat — AgriDeepAI</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --background: #171b20;
      --surface: #1e232a;
      --surface-hover: #252c34;
      --border: rgba(255,255,255,0.09);
      --text: #edf1f5;
      --text-muted: #98a2ad;
      --accent: #2f8f46;
      --accent-dim: rgba(47, 143, 70, 0.25);
      --danger: #e85d5d;
      --radius-md: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      -webkit-text-size-adjust: 100%;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .85rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: .6rem; min-width: 0; }
    .header-left img { height: 28px; width: auto; }
    .header-title { font-weight: 700; font-size: .95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-sub { color: var(--text-muted); font-size: .75rem; font-weight: 400; }
    .header-cta {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: .5rem .9rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 600;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .header-cta:hover { background: #3ca457; }
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    #shareStatus {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    #shareStatus.error { color: var(--danger); }
    .msg-row { display: flex; flex-direction: column; width: 100%; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }
    .msg-header {
      display: flex; align-items: center; gap: .4rem;
      margin-bottom: .25rem; font-size: .85rem; font-weight: 600;
      color: var(--text);
    }
    .msg-header img { height: 20px; width: auto; border-radius: 4px; }
    .msg-bubble {
      max-width: min(780px, 85%);
      padding: .65rem 1rem;
      border-radius: var(--radius-md);
      line-height: 1.65;
      word-wrap: break-word;
      font-size: .95rem;
    }
    .msg-bubble.user {
      background: var(--accent-dim);
      border: 1px solid rgba(255,255,255,.06);
      border-bottom-right-radius: 4px;
      color: var(--text);
      white-space: pre-wrap;
    }
    .msg-bubble.assistant {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
      width: 100%;
      max-width: min(780px, 92%);
    }
    .msg-bubble.assistant h1, .msg-bubble.assistant h2, .msg-bubble.assistant h3 { margin: .6rem 0 .3rem; font-weight: 600; }
    .msg-bubble.assistant h1 { font-size: 1.3rem; }
    .msg-bubble.assistant h2 { font-size: 1.15rem; }
    .msg-bubble.assistant h3 { font-size: 1rem; }
    .msg-bubble.assistant p { margin: .25rem 0; }
    .msg-bubble.assistant ul, .msg-bubble.assistant ol { padding-left: 1.2rem; margin: .25rem 0; }
    .msg-bubble.assistant li { margin: .15rem 0; }
    .msg-bubble.assistant code { background: var(--surface-hover); padding: .05rem .3rem; border-radius: 4px; font-family: monospace; font-size: .9em; }
    .msg-bubble.assistant pre { background: var(--surface-hover); padding: .5rem; border-radius: 10px; overflow-x: auto; }
    .msg-bubble.assistant table { border-collapse: collapse; width: 100%; margin: .4rem 0; font-size: .9em; display: block; overflow-x: auto; }
    .msg-bubble.assistant th, .msg-bubble.assistant td { border: 1px solid var(--border); padding: .25rem .5rem; text-align: left; }
    .msg-bubble.assistant th { background: var(--surface-hover); }
    .msg-bubble.assistant blockquote { border-left: 3px solid var(--accent); padding-left: .6rem; margin: .3rem 0; color: var(--text-muted); }
    .msg-bubble.assistant hr { display: none; }

    /* Generated image inside a shared assistant bubble */
    .gen-image-wrap {
      position: relative;
      margin-top: .6rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--background);
      max-width: min(560px, 100%);
    }
    .gen-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }
    .gen-download-btn {
      position: absolute;
      top: .5rem;
      right: .5rem;
      background: rgba(0,0,0,.6);
      color: #fff;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      padding: .4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-width: 36px;
      min-height: 36px;
      backdrop-filter: blur(4px);
      transition: background .15s;
    }
    .gen-download-btn:hover { background: rgba(0,0,0,.85); }
    .gen-download-btn svg { width: 16px; height: 16px; }

    /* Lightbox */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: zoom-out;
      animation: fadeIn .2s ease;
    }
    .lightbox-overlay img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ===== Version switcher on shared user messages ===== */
    .share-version-controls {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      margin-top: .35rem;
      font-size: .8rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .2rem .3rem;
    }
    .share-version-controls button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: .25rem .35rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 30px;
      transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .share-version-controls button:hover:not(:disabled) {
      background: var(--surface-hover);
      color: var(--text);
    }
    .share-version-controls button:disabled {
      opacity: .3;
      cursor: not-allowed;
    }
    .share-version-controls span {
      padding: 0 .35rem;
      color: var(--text-muted);
      font-size: .8rem;
      user-select: none;
    }
    .msg-row.user .share-version-controls {
      align-self: flex-end;
    }

    @media (max-width: 480px) {
      .msg-bubble { max-width: 92%; padding: .55rem .85rem; font-size: .92rem; }
      main { padding: 1rem .75rem 2.5rem; }
      header { padding: .7rem .75rem; }
      .header-title { font-size: .85rem; }
      .header-cta { padding: .45rem .75rem; font-size: .8rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="/logo.png" alt="agrideepai" />
      <div>
        <div class="header-title">Shared Chat</div>
        <div class="header-sub">via AgriDeepAI</div>
      </div>
    </div>
    <a class="header-cta" href="/">Open AgriDeepAI</a>
  </header>
  <main>
    <div id="shareStatus">Loading shared chat…</div>
    <div id="shareMessages"></div>
  </main>

  <script>
    (function () {
      'use strict';

      var statusEl = document.getElementById('shareStatus');
      var listEl = document.getElementById('shareMessages');

      console.log('[SHARE] Script running. Path:', window.location.pathname);

      function setStatus(text, isError) {
        if (!statusEl) return;
        statusEl.textContent = text;
        statusEl.style.display = '';
        if (isError) statusEl.classList.add('error');
      }

      function safeMd(text) {
        try {
          if (window.marked && typeof window.marked.parse === 'function') {
            var html = String(window.marked.parse(text || ''));
            return html.replace(/<hr\s*\/?>/g, '');
          }
        } catch (e) { console.warn('[SHARE] marked.parse error:', e); }
        return String(text || '').replace(/[<>&]/g, function (c) {
          return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;';
        });
      }

      function openLightbox(src) {
        var overlay = document.createElement('div');
        overlay.className = 'lightbox-overlay';
        var closeBtn = document.createElement('button');
        closeBtn.innerHTML = '&times;';
        closeBtn.style.cssText = 'position:absolute;top:1rem;right:1rem;background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:2rem;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;';
        closeBtn.onclick = function (e) { e.stopPropagation(); overlay.remove(); };
        overlay.appendChild(closeBtn);
        var img = document.createElement('img');
        img.src = src;
        overlay.appendChild(img);
        overlay.onclick = function () { overlay.remove(); };
        document.body.appendChild(overlay);
      }

      async function downloadImage(url, filename) {
        try {
          var resp = await fetch(url, { mode: 'cors' });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var blob = await resp.blob();
          var blobUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename || ('agrideepai-' + Date.now() + '.jpg');
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 2000);
        } catch (err) {
          console.warn('[SHARE] Download fallback:', err);
          window.open(url, '_blank');
        }
      }

      function renderGeneratedImageBlock(genFile) {
        var wrap = document.createElement('div');
        wrap.className = 'gen-image-wrap';

        var img = document.createElement('img');
        img.src = genFile.public_url;
        img.alt = 'Generated image';
        img.onclick = function () { openLightbox(genFile.public_url); };
        img.onerror = function () {
          var err = document.createElement('div');
          err.style.cssText = 'padding:1rem;color:#98a2ad;font-size:.85rem;text-align:center;';
          err.textContent = 'Image unavailable.';
          wrap.replaceChildren(err);
        };
        wrap.appendChild(img);

        var btn = document.createElement('button');
        btn.className = 'gen-download-btn';
        btn.title = 'Download image';
        btn.setAttribute('aria-label', 'Download image');
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
        btn.onclick = function (e) {
          e.stopPropagation();
          downloadImage(genFile.public_url, 'agrideepai-' + Date.now() + '.jpg');
        };
        wrap.appendChild(btn);

        return wrap;
      }

      // Render the inner content of a message bubble from the message object.
      // Called both initially and when the user switches versions.
      function renderBubbleContent(bubbleEl, msg) {
        bubbleEl.innerHTML = '';
        var content = (msg.content == null) ? '' : String(msg.content);

        if (content) {
          if (msg.role === 'assistant') {
            var textWrap = document.createElement('div');
            textWrap.innerHTML = safeMd(content);
            bubbleEl.appendChild(textWrap);
          } else {
            bubbleEl.textContent = content;
          }
        }

        var files = Array.isArray(msg.files) ? msg.files : [];
        files.forEach(function (f) {
          if (!f || !f.public_url) return;
          var isImage = (f.mime_type && f.mime_type.indexOf('image/') === 0) || f.generated;
          if (!isImage) return;

          if (msg.role === 'assistant' && f.generated) {
            bubbleEl.appendChild(renderGeneratedImageBlock(f));
          } else {
            var thumb = document.createElement('img');
            thumb.src = f.public_url;
            thumb.alt = f.filename || 'image';
            thumb.style.cssText = 'display:block;max-width:200px;max-height:200px;object-fit:cover;border-radius:8px;margin-top:.4rem;cursor:zoom-in;';
            thumb.onclick = function () { openLightbox(f.public_url); };
            bubbleEl.appendChild(thumb);
          }
        });
      }

      if (!statusEl || !listEl) {
        console.error('[SHARE] Missing #shareStatus or #shareMessages');
        return;
      }

      var path = window.location.pathname;
      var token = path.replace(/^\/share\//, '').split('/')[0].split('?')[0];
      if (!token) { setStatus('Invalid share link.', true); return; }

      var apiUrl = '/api/share/' + encodeURIComponent(token);
      console.log('[SHARE] Fetching', apiUrl);

      var ctrl = new AbortController();
      var timer = setTimeout(function () {
        try { ctrl.abort(); } catch (e) {}
      }, 15000);

      fetch(apiUrl, { cache: 'no-store', signal: ctrl.signal })
        .then(function (res) {
          clearTimeout(timer);
          console.log('[SHARE] Response status:', res.status, res.headers.get('content-type'));
          if (!res.ok) {
            return res.text().then(function (body) {
              var msg = 'HTTP ' + res.status;
              try {
                var parsed = JSON.parse(body);
                if (parsed && parsed.error) msg = parsed.error;
              } catch (e) {}
              throw new Error(msg);
            });
          }
          return res.json();
        })
        .then(function (data) {
          console.log('[SHARE] Data received:', data);
          var messages = (data && Array.isArray(data.messages)) ? data.messages : [];
          if (!messages.length) {
            setStatus('This shared chat is empty.', false);
            return;
          }
          statusEl.style.display = 'none';

          // Rows keep a reference to their associated message object so version
          // switching can update the DOM after mutating the object.
          var rows = [];

          messages.forEach(function (msg, msgIdx) {
            if (!msg || !msg.role) return;
            var row = document.createElement('div');
            row.className = 'msg-row ' + msg.role;
            row.dataset.msgIdx = String(msgIdx);
            row._msg = msg;

            if (msg.role === 'assistant') {
              var h = document.createElement('div');
              h.className = 'msg-header';
              h.innerHTML = '<img src="/logo.png" alt="" /><span>agrideepai</span>';
              row.appendChild(h);
            }

            var bubble = document.createElement('div');
            bubble.className = 'msg-bubble ' + msg.role;
            renderBubbleContent(bubble, msg);
            row.appendChild(bubble);

            // Version switcher for user messages with multiple versions
            if (msg.role === 'user' && Array.isArray(msg.versions) && msg.versions.length > 1) {
              var curIdx = (typeof msg.currentVersionIndex === 'number'
                && msg.currentVersionIndex >= 0
                && msg.currentVersionIndex < msg.versions.length)
                ? msg.currentVersionIndex : 0;

              var vc = document.createElement('div');
              vc.className = 'share-version-controls';

              var prevBtn = document.createElement('button');
              prevBtn.type = 'button';
              prevBtn.setAttribute('aria-label', 'Previous version');
              prevBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';

              var nextBtn = document.createElement('button');
              nextBtn.type = 'button';
              nextBtn.setAttribute('aria-label', 'Next version');
              nextBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

              var lbl = document.createElement('span');

              var updateButtons = function () {
                lbl.textContent = (curIdx + 1) + ' / ' + msg.versions.length;
                prevBtn.disabled = curIdx === 0;
                nextBtn.disabled = curIdx === msg.versions.length - 1;
              };

              var applyVersion = function (newIdx) {
                curIdx = newIdx;
                // Update user message content & files
                msg.content = msg.versions[newIdx] || '';
                if (Array.isArray(msg.versionFiles) && Array.isArray(msg.versionFiles[newIdx])) {
                  msg.files = msg.versionFiles[newIdx];
                } else {
                  msg.files = [];
                }
                renderBubbleContent(bubble, msg);

                // Update the following assistant message
                var aiMsg = messages[msgIdx + 1];
                var aiRow = rows[msgIdx + 1];
                if (aiMsg && aiMsg.role === 'assistant') {
                  if (Array.isArray(msg.aiReplies) && msg.aiReplies[newIdx] !== undefined) {
                    aiMsg.content = msg.aiReplies[newIdx] || '';
                  }
                  if (Array.isArray(msg.aiFiles) && Array.isArray(msg.aiFiles[newIdx])) {
                    aiMsg.files = msg.aiFiles[newIdx];
                  } else {
                    aiMsg.files = [];
                  }
                  if (aiRow) {
                    var aiBubble = aiRow.querySelector('.msg-bubble');
                    if (aiBubble) renderBubbleContent(aiBubble, aiMsg);
                  }
                }
                updateButtons();
              };

              prevBtn.onclick = function () { if (curIdx > 0) applyVersion(curIdx - 1); };
              nextBtn.onclick = function () { if (curIdx < msg.versions.length - 1) applyVersion(curIdx + 1); };

              vc.appendChild(prevBtn);
              vc.appendChild(lbl);
              vc.appendChild(nextBtn);
              row.appendChild(vc);
              updateButtons();
            }

            listEl.appendChild(row);
            rows.push(row);
          });

          document.title = 'Shared Chat — AgriDeepAI';
          console.log('[SHARE] Rendered', messages.length, 'messages');
        })
        .catch(function (err) {
          clearTimeout(timer);
          var msg = (err && err.name === 'AbortError') ? 'Request timed out' : (err && err.message) || 'unknown error';
          console.error('[SHARE] Error:', err);
          setStatus('Unable to load this shared chat: ' + msg, true);
        });
    })();
  </script>
</body>
</html>
