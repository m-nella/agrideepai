<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriDeepAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 100vh;
            background: #1a1a1a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* Header */
        .header {
            padding: 16px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
        }

        .header h1 span {
            color: #22c55e;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .header-actions button:hover {
            background: #2a2a2a;
            color: #fff;
        }

        /* Chat Messages */
        .messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: #2563eb;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: #2a2a2a;
            color: #e5e5e5;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.bot .loading-dots {
            display: inline-block;
        }

        .message.bot .loading-dots span {
            animation: pulse 1.2s infinite;
            display: inline-block;
        }

        .message.bot .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .message.bot .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: #2563eb;
        }

        .input-area input::placeholder {
            color: #666;
        }

        .input-area button {
            padding: 12px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .input-area button:hover {
            background: #1d4ed8;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            padding: 8px 24px 16px;
            background: #1a1a1a;
            text-align: center;
            font-size: 12px;
            color: #444;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
        }

        /* Placeholder when no messages */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            text-align: center;
        }

        .empty-state h2 {
            color: #888;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .chat-container {
                border-radius: 0;
            }
            .header h1 {
                font-size: 16px;
            }
            .message {
                max-width: 95%;
                font-size: 14px;
            }
            .input-area input {
                font-size: 14px;
            }
            .input-area button {
                font-size: 14px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="header">
            <h1>🌾 Agri<span>DeepAI</span></h1>
            <div class="header-actions">
                <button id="signInBtn" onclick="alert('Account system coming soon!')">Sign In</button>
                <button id="signUpBtn" onclick="alert('Account system coming soon!')">Sign Up</button>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="icon">🌾</div>
                <h2>Welcome to AgriDeepAI</h2>
                <p>Ask me anything about agriculture, livestock, crop diseases, farming techniques, and more.</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask me about agriculture and livestock..." />
            <button id="sendBtn">Send</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            Built by Ornella Mutuyimana · Powered by Groq &amp; Gemini
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesDiv = document.getElementById('messages');
        const emptyState = document.getElementById('emptyState');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Send message
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Clear empty state
            emptyState.style.display = 'none';

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';
            userInput.focus();

            // Show loading indicator
            const loadingId = addMessage('Thinking...', 'bot', true);

            try {
                // TODO: Connect to Cloudflare Worker in Phase 2
                // For now, simulate a response
                setTimeout(() => {
                    const fakeResponse = "This is a demo response. In Phase 2, we'll connect to real AI via Cloudflare Worker with Groq and Gemini, giving you full intelligence and web search capabilities.";
                    replaceLoading(loadingId, fakeResponse);
                }, 1500);

            } catch (error) {
                replaceLoading(loadingId, 'Sorry, I encountered an error. Please try again.');
            }
        }

        // Add a message to the chat
        function addMessage(text, sender, isLoading = false) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;

            if (isLoading) {
                div.innerHTML = `<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>`;
            } else {
                div.textContent = text;
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            return div;
        }

        // Replace loading message with final response
        function replaceLoading(loadingElement, response) {
            loadingElement.className = 'message bot';
            loadingElement.textContent = response;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        console.log('🌾 AgriDeepAI loaded. Phase 1 complete!');
    </script>
</body>
</html>
