    <!-- ==========================================================

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            console.error('❌ Global error:', message, error);
            return false;
        };

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 AgriDeepAI script started.');

            const APP_CONFIG = {
                name: 'AgriDeepAI',
                version: '3.0.0',
                apiEndpoint: '/api/chat',
                enableAttachments: true,
                maxFileSize: 10 * 1024 * 1024,
                allowedFileTypes: ['image/*', '.pdf', '.doc', '.docx', '.txt'],
                maxAttachments: 5,
            };

            const state = {
                conversations: {},
                activeId: null,
                isGenerating: false,
                isStreaming: false,
                abortController: null,
                theme: 'dark',
                enterToSend: true,
                user: null,
                sessionToken: null,
                attachments: [],
                selectedModel: 'groq/compound-mini',
                temperature: 0.7,
                webSearchEnabled: true,
                userScrolledUp: false,
                isAuthenticated: false,
                dropdownOpen: false,
                pendingEmail: null,
                pendingPassword: null,
                pendingName: null,
                verificationCode: null,
                codeExpiry: null,
                loginEmail: null,
                loginUserId: null,
                resendCooldown: false,
            };

            // ... (all DOM refs and helper functions from previous versions)
            // I'll skip them for brevity; they are unchanged.

            // ==========================================================
            // KEY FIXES: Correct endpoints
            // ==========================================================

            async function handleSignUp(name, email, password) {
                if (!isValidEmail(email)) {
                    if (authError) {
                        authError.textContent = 'Please enter a valid email address (e.g., name@domain.com).';
                        authError.classList.add('is-visible');
                    }
                    return;
                }
                try {
                    const code = Math.floor(100000 + Math.random() * 900000).toString();
                    // ✅ Correct endpoint: /api/send-verification
                    const sendRes = await fetch('/api/send-verification', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code }),
                    });
                    if (!sendRes.ok) {
                        const err = await sendRes.json();
                        throw new Error(err.error || 'Failed to send code');
                    }
                    state.pendingEmail = email;
                    state.pendingPassword = password;
                    state.pendingName = name;
                    state.verificationCode = code;
                    state.codeExpiry = Date.now() + 5 * 60 * 1000;
                    authMode = 'confirm';
                    if (authModalTitle) authModalTitle.textContent = 'Verify Your Email';
                    if (authModalDesc) authModalDesc.textContent = `We sent a 6-digit code to ${email}. Please enter it below.`;
                    if (authSubmitBtn) authSubmitBtn.textContent = 'Verify';
                    if (authSwitchBtn) authSwitchBtn.style.display = 'none';
                    if (authNameField) authNameField.style.display = 'none';
                    if (authConfirmField) authConfirmField.style.display = 'none';
                    if (authCodeField) authCodeField.style.display = 'block';
                    if (authError) {
                        authError.classList.remove('is-visible');
                        authError.textContent = '';
                    }
                    showToast('Verification code sent!', 'success');
                    startResendCooldown(30);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            }

            async function finalizeSignUp(code) {
                if (!state.pendingEmail) {
                    if (authError) {
                        authError.textContent = 'No pending sign-up. Please start over.';
                        authError.classList.add('is-visible');
                    }
                    return;
                }
                try {
                    // ✅ Correct endpoint: /api/auth/signup
                    const response = await fetch('/api/auth/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: state.pendingEmail,
                            password: state.pendingPassword,
                            name: state.pendingName,
                            verificationCode: code,
                        }),
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Sign-up failed');
                    }
                    saveSession(data.user, data.sessionToken);
                    closeModal(authModal);
                    showToast('Account created!', 'success');
                    await loadConversations(data.user.id);
                    state.pendingEmail = null;
                    state.pendingPassword = null;
                    state.pendingName = null;
                    state.verificationCode = null;
                    state.codeExpiry = null;
                } catch (err) {
                    if (authError) {
                        authError.textContent = err.message;
                        authError.classList.add('is-visible');
                    }
                }
            }

            async function finalizeLogin(code) {
                if (!state.loginEmail) {
                    if (authError) {
                        authError.textContent = 'No pending login. Please start over.';
                        authError.classList.add('is-visible');
                    }
                    return;
                }
                try {
                    // ✅ Correct endpoint: /api/auth/verify-login
                    const response = await fetch('/api/auth/verify-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: state.loginEmail, code }),
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Verification failed');
                    }
                    saveSession(data.user, data.sessionToken);
                    closeModal(authModal);
                    showToast('Signed in!', 'success');
                    await loadConversations(data.user.id);
                    state.loginEmail = null;
                    state.loginUserId = null;
                } catch (err) {
                    if (authError) {
                        authError.textContent = err.message;
                        authError.classList.add('is-visible');
                    }
                }
            }

            // ==========================================================
            // The rest of your existing functions (loadConversations, signIn, etc.)
            // remain unchanged from the previous version.
            // Make sure they use the correct endpoints:
            // - /api/auth/login
            // - /api/auth/signup
            // - /api/auth/verify-login
            // - /api/send-verification
            // - /api/conversations
            // ==========================================================

            // ... (all other functions from previous version)

            init();
        });
    </script>
