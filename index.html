<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AgriDeepAI</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
        /* ============================
           CSS VARIABLES / THEMING
        ============================ */
        :root {
            --bg-primary: #0b0b0b;
            --bg-secondary: #141414;
            --bg-surface: #1c1c1e;
            --bg-elevated: #262628;
            --bg-hover: #2c2c2e;
            --bg-input: #1e1e20;
            --bg-modal: #1a1a1c;
            --bg-toast: #2a2a2c;

            --text-primary: #ececf1;
            --text-secondary: #a8a8b0;
            --text-muted: #6a6a72;
            --text-inverse: #0b0b0b;

            --border-color: #2a2a2e;
            --border-light: #3a3a3e;

            --accent: #4f8fff;
            --accent-hover: #6a9fff;
            --accent-glow: rgba(79, 143, 255, 0.15);

            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.8);

            --sidebar-width: 260px;
            --sidebar-collapsed: 72px;
            --header-height: 56px;
            --composer-max-height: 200px;

            --transition-fast: 0.15s ease;
            --transition-med: 0.25s ease;
            --transition-slow: 0.4s ease;

            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        }

        /* Light theme */
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-surface: #f0f0f2;
            --bg-elevated: #e8e8ea;
            --bg-hover: #e0e0e2;
            --bg-input: #eeeeef;
            --bg-modal: #f8f8fa;
            --bg-toast: #e8e8ea;

            --text-primary: #1a1a1e;
            --text-secondary: #4a4a52;
            --text-muted: #7a7a82;
            --text-inverse: #f5f5f7;

            --border-color: #d0d0d4;
            --border-light: #c0c0c4;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.16);
        }

        /* ============================
           RESET & BASE
        ============================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================
           APP LAYOUT
        ============================ */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        /* ============================
           SIDEBAR
        ============================ */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width var(--transition-med), transform var(--transition-med);
            overflow: hidden;
            position: relative;
            z-index: 200;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
        }

        .sidebar.collapsed .sidebar-brand span,
        .sidebar.collapsed .new-chat-btn span,
        .sidebar.collapsed .chat-item .title,
        .sidebar.collapsed .chat-item .chat-actions,
        .sidebar.collapsed .account-btn .info,
        .sidebar.collapsed .account-btn .settings-icon {
            opacity: 0;
            pointer-events: none;
            width: 0;
            overflow: hidden;
        }

        .sidebar.collapsed .new-chat-btn {
            justify-content: center;
            padding: 12px;
            width: 48px;
            margin: 12px auto;
        }

        .sidebar.collapsed .new-chat-btn svg {
            margin: 0;
        }

        .sidebar.collapsed .sidebar-toggle-btn {
            transform: rotate(180deg);
        }

        .sidebar.collapsed .sidebar-brand {
            justify-content: center;
        }

        .sidebar.collapsed .sidebar-brand img {
            margin: 0;
        }

        /* Sidebar Header */
        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            min-height: 64px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            white-space: nowrap;
        }

        .sidebar-brand img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .sidebar-brand span {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            transition: opacity var(--transition-fast);
        }

        .sidebar-brand span .accent {
            color: var(--accent);
        }

        .sidebar-toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
        }

        .sidebar-toggle-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-toggle-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* New Chat Button */
        .new-chat-btn {
            margin: 12px 16px;
            padding: 12px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            flex-shrink: 0;
            min-height: 48px;
        }

        .new-chat-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.01);
        }

        .new-chat-btn:active {
            transform: scale(0.98);
        }

        .new-chat-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .new-chat-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .new-chat-btn span {
            transition: opacity var(--transition-fast);
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        .chat-item {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            position: relative;
            gap: 8px;
            min-height: 40px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--bg-elevated);
        }

        .chat-item .title {
            font-size: 14px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            transition: opacity var(--transition-fast);
        }

        .chat-item.active .title {
            color: var(--text-primary);
        }

        .chat-item .chat-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .chat-item .chat-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            line-height: 1;
        }

        .chat-item .chat-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-item .chat-actions button.pinned {
            color: #f5a623;
        }

        .empty-history {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 40px 16px;
            line-height: 1.6;
        }

        /* Sidebar Footer — Account */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .account-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            text-align: left;
            min-height: 48px;
        }

        .account-btn:hover {
            background: var(--bg-hover);
        }

        .account-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .account-btn .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .account-btn .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-btn .info {
            flex: 1;
            min-width: 0;
            transition: opacity var(--transition-fast);
        }

        .account-btn .info .name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-btn .info .email {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .account-btn .settings-icon {
            color: var(--text-muted);
            font-size: 18px;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }

        .account-btn:hover .settings-icon {
            color: var(--text-primary);
        }

        /* ============================
           MAIN CHAT AREA
        ============================ */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh;
            min-width: 0;
            position: relative;
        }

        /* Chat Header */
        .chat-header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-primary);
            min-height: var(--header-height);
        }

        .chat-header .sidebar-open-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 22px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            line-height: 1;
            display: none;
        }

        .chat-header .sidebar-open-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chat-header .chat-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 100px 32px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }

        .empty-state .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .empty-state h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .empty-state h1 .accent {
            color: var(--accent);
        }

        .empty-state .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.6;
            margin-top: 4px;
        }

        .empty-state .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
            justify-content: center;
        }

        .empty-state .suggestions button {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: var(--radius-full);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: inherit;
        }

        .empty-state .suggestions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .empty-state.hidden {
            display: none;
        }

        /* Messages */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
            max-width: 82%;
        }

        .message-wrapper.user {
            align-self: flex-end;
        }

        .message-wrapper.bot {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.7;
            word-wrap: break-word;
            max-width: 100%;
            position: relative;
        }

        .message-wrapper.user .message-bubble {
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message-wrapper.bot .message-bubble {
            background: var(--bg-surface);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-wrapper.bot .message-bubble .loading-dots span {
            animation: pulse 1.2s infinite;
            display: inline-block;
        }

        .message-wrapper.bot .message-bubble .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .message-wrapper.bot .message-bubble .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%,
            60%,
            100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        /* Message Actions */
        .message-actions {
            display: flex;
            gap: 2px;
            margin-top: 6px;
            opacity: 0;
            transition: var(--transition-fast);
            flex-wrap: wrap;
        }

        .message-wrapper:hover .message-actions,
        .message-wrapper:focus-within .message-actions {
            opacity: 1;
        }

        .message-wrapper.user .message-actions {
            justify-content: flex-end;
        }

        .message-wrapper.bot .message-actions {
            justify-content: flex-start;
        }

        .message-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition-fast);
            font-family: inherit;
            line-height: 1;
        }

        .message-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .message-actions button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .message-actions button.liked {
            color: var(--accent);
        }

        .message-actions button.disliked {
            color: #ef4444;
        }

        .message-actions button.copied {
            color: var(--accent);
        }

        /* Edit Container */
        .edit-container {
            width: 100%;
            margin-top: 6px;
        }

        .edit-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            min-height: 44px;
            transition: var(--transition-fast);
        }

        .edit-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .edit-actions button {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            transition: var(--transition-fast);
        }

        .edit-actions .save-edit {
            background: var(--accent);
            color: #fff;
        }

        .edit-actions .save-edit:hover {
            background: var(--accent-hover);
        }

        .edit-actions .cancel-edit {
            background: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .edit-actions .cancel-edit:hover {
            background: var(--bg-hover);
        }

        /* ============================
           COMPOSER
        ============================ */
        .composer-wrapper {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 32px 24px 32px;
            background: linear-gradient(to top, var(--bg-primary) 55%, transparent);
            flex-shrink: 0;
        }

        .composer {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px 10px 8px 16px;
            transition: var(--transition-fast);
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .composer:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .composer .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }

        .composer textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            padding: 8px 0;
            resize: none;
            min-height: 24px;
            max-height: var(--composer-max-height);
            line-height: 1.5;
        }

        .composer textarea::placeholder {
            color: var(--text-muted);
        }

        .composer .composer-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .composer .composer-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition-fast);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            position: relative;
        }

        .composer .composer-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .composer .composer-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .composer .composer-actions button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .composer .composer-actions .send-btn {
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .composer .composer-actions .send-btn.visible {
            display: flex;
        }

        .composer .composer-actions .send-btn:hover {
            background: var(--accent-hover);
        }

        .composer .composer-actions .send-btn:disabled {
            opacity: 0.4;
        }

        .composer .composer-actions .stop-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .composer .composer-actions .stop-btn.active {
            display: flex;
        }

        .composer .composer-actions .stop-btn:hover {
            background: var(--bg-hover);
        }

        .file-input {
            display: none;
        }

        /* Attachment previews */
        .attachment-previews {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0 8px 0;
        }

        .attachment-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            padding: 6px 10px 6px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            animation: fadeIn 0.2s ease;
        }

        .attachment-preview img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }

        .attachment-preview .file-icon {
            font-size: 20px;
        }

        .attachment-preview .file-name {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .attachment-preview .remove-attachment {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            line-height: 1;
            transition: var(--transition-fast);
        }

        .attachment-preview .remove-attachment:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ============================
           SCROLL TO BOTTOM BUTTON
        ============================ */
        .scroll-bottom-btn {
            position: absolute;
            bottom: 100px;
            right: 32px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            transition: var(--transition-fast);
            box-shadow: var(--shadow-sm);
            z-index: 50;
        }

        .scroll-bottom-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .scroll-bottom-btn.visible {
            display: flex;
        }

        /* ============================
           MODAL
        ============================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 32px;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-box .modal-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-box .modal-header .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 24px;
            padding: 4px;
            line-height: 1;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
        }

        .modal-box .modal-header .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-box .modal-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-box .field {
            margin-bottom: 16px;
        }

        .modal-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal-box .field input,
        .modal-box .field select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition-fast);
            font-family: inherit;
        }

        .modal-box .field input:focus,
        .modal-box .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .modal-box .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }

        .modal-box .error-msg.visible {
            display: block;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .modal-box .modal-actions button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: inherit;
            min-width: 80px;
        }

        .modal-box .modal-actions .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .modal-box .modal-actions .btn-primary:hover {
            background: var(--accent-hover);
        }

        .modal-box .modal-actions .btn-secondary {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .modal-box .modal-actions .btn-secondary:hover {
            background: var(--bg-hover);
        }

        .modal-box .modal-actions .btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }

        .modal-box .modal-actions .btn-ghost:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .modal-box .modal-actions .btn-danger {
            background: #ef4444;
            color: #fff;
        }

        .modal-box .modal-actions .btn-danger:hover {
            background: #dc2626;
        }

        /* ============================
           TOASTS
        ============================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: 100%;
            pointer-events: none;
        }

        .toast {
            background: var(--bg-toast);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInToast 0.3s ease;
            pointer-events: auto;
            transition: var(--transition-fast);
        }

        .toast.hiding {
            opacity: 0;
            transform: translateX(40px);
        }

        @keyframes slideInToast {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast .toast-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .toast .toast-msg {
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
        }

        .toast .toast-dismiss {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            line-height: 1;
            transition: var(--transition-fast);
        }

        .toast .toast-dismiss:hover {
            color: var(--text-primary);
        }

        .toast.success .toast-icon {
            color: #22c55e;
        }
        .toast.error .toast-icon {
            color: #ef4444;
        }
        .toast.warning .toast-icon {
            color: #f59e0b;
        }
        .toast.info .toast-icon {
            color: var(--accent);
        }

        /* ============================
           ANIMATIONS
        ============================ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================
           RESPONSIVE
        ============================ */

        /* Tablet */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 300;
                box-shadow: var(--shadow-lg);
                border-right: none;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.open+.sidebar-overlay {
                display: block;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 299;
                animation: fadeIn 0.2s ease;
            }

            .chat-header .sidebar-open-btn {
                display: block;
            }

            .chat-header .chat-title {
                font-size: 14px;
            }

            .messages-container {
                padding: 16px 16px 80px 16px;
            }

            .composer-wrapper {
                padding: 8px 16px 16px 16px;
            }

            .composer {
                border-radius: var(--radius-md);
            }

            .empty-state h1 {
                font-size: 24px;
            }

            .empty-state .logo {
                width: 60px;
                height: 60px;
            }

            .message-wrapper {
                max-width: 92%;
            }

            .modal-box {
                max-width: 400px;
                padding: 24px;
            }
        }

        /* Phone */
        @media (max-width: 600px) {
            .messages-container {
                padding: 12px 12px 70px 12px;
            }

            .message-bubble {
                font-size: 14px;
                padding: 10px 14px;
                border-radius: 14px;
            }

            .message-wrapper {
                max-width: 96%;
            }

            .composer-wrapper {
                padding: 6px 12px 12px 12px;
            }

            .composer {
                padding: 6px 8px 6px 12px;
                border-radius: var(--radius-md);
            }

            .composer textarea {
                font-size: 14px;
                padding: 6px 0;
                min-height: 20px;
            }

            .composer .composer-actions button {
                width: 32px;
                height: 32px;
                font-size: 16px;
                padding: 4px;
            }

            .composer .composer-actions .send-btn,
            .composer .composer-actions .stop-btn {
                width: 32px;
                height: 32px;
            }

            .empty-state .logo {
                width: 48px;
                height: 48px;
            }

            .empty-state h1 {
                font-size: 20px;
            }

            .empty-state .subtitle {
                font-size: 14px;
            }

            .empty-state .suggestions button {
                font-size: 12px;
                padding: 6px 14px;
            }

            .sidebar {
                width: 280px;
            }

            .chat-header {
                padding: 0 12px;
                height: 48px;
                min-height: 48px;
            }

            .chat-header .sidebar-open-btn {
                font-size: 20px;
                padding: 4px;
            }

            .modal-box {
                padding: 20px;
                max-width: 340px;
            }

            .modal-box .modal-header h2 {
                font-size: 20px;
            }

            .toast-container {
                right: 12px;
                bottom: 80px;
                max-width: 300px;
            }
        }

        @media (max-width: 400px) {
            .messages-container {
                padding: 8px 8px 60px 8px;
            }

            .message-bubble {
                font-size: 13px;
                padding: 8px 12px;
            }

            .composer textarea {
                font-size: 13px;
            }

            .empty-state h1 {
                font-size: 18px;
            }

            .empty-state .suggestions button {
                font-size: 11px;
                padding: 4px 10px;
            }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            .messages-container {
                padding: 12px 16px 70px 16px;
            }

            .empty-state .logo {
                width: 40px;
                height: 40px;
            }
            .empty-state h1 {
                font-size: 18px;
            }
            .empty-state .suggestions {
                margin-top: 16px;
            }
            .sidebar {
                width: 240px;
            }
        }

        /* Touch: always show actions */
        @media (hover: none) {
            .message-actions {
                opacity: 1;
            }
            .chat-item .chat-actions {
                opacity: 1;
            }
        }

        /* ============================
           ACCESSIBILITY / FOCUS
        ============================ */
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ============================
           SCROLLBAR
        ============================ */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    APP
    ============================================================ -->
    <div class="app" id="app">

        <!-- ============================================================
        SIDEBAR
        ============================================================ -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">

            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img src="logo.png" alt="AgriDeepAI Logo" id="sidebarLogo" />
                    <span>Agri<span class="accent">DeepAI</span></span>
                </div>
                <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle sidebar" title="Toggle sidebar">
                    ◀
                </button>
            </div>

            <!-- New Chat Button -->
            <button class="new-chat-btn" id="newChatBtn" title="Start a new conversation">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>New Chat</span>
            </button>

            <!-- Chat History -->
            <div class="chat-history" id="chatHistory">
                <div class="empty-history" id="emptyHistory">No chats yet.<br />Start a new conversation!</div>
            </div>

            <!-- Sidebar Footer: Account -->
            <div class="sidebar-footer">
                <button class="account-btn" id="accountBtn" aria-label="Account menu">
                    <div class="avatar" id="avatarDisplay">👤</div>
                    <div class="info">
                        <div class="name" id="userNameDisplay">Guest</div>
                        <div class="email" id="userEmailDisplay">Not signed in</div>
                    </div>
                    <span class="settings-icon" id="settingsIcon" title="Settings">⚙️</span>
                </button>
            </div>
        </aside>

        <!-- Sidebar overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- ============================================================
        MAIN CHAT
        ============================================================ -->
        <main class="main-chat" id="mainChat">

            <!-- Chat Header -->
            <header class="chat-header" id="chatHeader">
                <button class="sidebar-open-btn" id="sidebarOpenBtn" aria-label="Open sidebar" title="Open sidebar">
                    ☰
                </button>
                <span class="chat-title" id="chatTitle">AgriDeepAI</span>
            </header>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <img src="logo.png" alt="AgriDeepAI" class="logo" id="emptyLogo" />
                    <h1>Agri<span class="accent">DeepAI</span></h1>
                    <div class="subtitle">Your AI assistant for agriculture, livestock. Where should we start today?</div>
                    <div class="suggestions">
                        <button data-suggestion="What are the best crops to grow in Rwanda?">🌱 Best crops in Rwanda</button>
                        <button data-suggestion="How to treat maize leaf disease?">🌽 Maize disease treatment</button>
                        <button data-suggestion="What is the best fertilizer for potatoes?">🥔 Best fertilizer</button>
                        <button data-suggestion="Tell me about livestock farming in Rwanda">🐄 Livestock farming</button>
                    </div>
                </div>

                <!-- Scroll-to-bottom button -->
                <button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="Scroll to bottom" title="Jump to latest">
                    ↓
                </button>
            </div>

            <!-- Composer -->
            <div class="composer-wrapper">
                <div class="composer" id="composer">
                    <!-- Attachment previews -->
                    <div class="attachment-previews" id="attachmentPreviews"></div>

                    <div class="input-row">
                        <textarea id="userInput" rows="1" placeholder="Ask me about agriculture and livestock..."></textarea>
                        <div class="composer-actions">
                            <button id="attachBtn" aria-label="Attach file" title="Attach file or image">📎</button>
                            <input type="file" id="fileInput" class="file-input" accept="image/*,.pdf,.doc,.docx,.txt" multiple />
                            <button id="microphoneBtn" aria-label="Voice input" title="Voice input">🎤</button>
                            <button class="stop-btn" id="stopBtn" aria-label="Stop generating" title="Stop generating">⏹</button>
                            <button class="send-btn" id="sendBtn" aria-label="Send message" title="Send message">➤</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ============================================================
    ACCOUNT MODAL
    ============================================================ -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Sign In</h2>
                <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
            </div>
            <p class="modal-desc" id="modalDesc">Sign in to save your chats and access your history.</p>
            <div id="modalFields">
                <div class="field" id="nameField" style="display:none;">
                    <label for="modalName">Full Name</label>
                    <input type="text" id="modalName" placeholder="Your name" />
                </div>
                <div class="field">
                    <label for="modalEmail">Email</label>
                    <input type="email" id="modalEmail" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label for="modalPassword">Password</label>
                    <input type="password" id="modalPassword" placeholder="••••••••" />
                </div>
                <div class="error-msg" id="modalError">Invalid credentials.</div>
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="modalSubmitBtn">Sign In</button>
                <button class="btn-secondary" id="modalSwitchBtn">Create Account</button>
                <button class="btn-ghost" id="modalGuestBtn">Continue as Guest</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    SETTINGS MODAL
    ============================================================ -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="modal-close" id="settingsCloseBtn" aria-label="Close">✕</button>
            </div>
            <div class="modal-desc">Customize your experience.</div>

            <div class="field">
                <label for="themeSelect">Appearance</label>
                <select id="themeSelect">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="system">System</option>
                </select>
            </div>

            <div class="field">
                <label for="enterSendSelect">Enter to send</label>
                <select id="enterSendSelect">
                    <option value="true">Enabled</option>
                    <option value="false">Disabled (Shift+Enter for new line)</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn-primary" id="settingsSaveBtn">Save</button>
                <button class="btn-secondary" id="settingsCloseActionBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    TOAST CONTAINER
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APP_CONFIG = {
            appName: 'AgriDeepAI',
            appVersion: '1.0.0',
            tagline: 'Your AI assistant for agriculture, livestock.',
            apiEndpoint: '/api/chat',
            enableVoice: true,
            enableAttachments: true,
            enableStreaming: true,
            enableLocalStorage: true,
            maxFileSize: 10 * 1024 * 1024, // 10MB
            allowedFileTypes: ['image/*', '.pdf', '.doc', '.docx', '.txt']
        };

        // ============================================================
        // STATE
        // ============================================================
        let state = {
            conversations: {},
            currentConversationId: null,
            messages: [],
            isGenerating: false,
            isStreaming: false,
            abortController: null,
            theme: 'dark',
            enterToSend: true,
            user: null,
            drafts: {}
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const qs = (sel, ctx) => (ctx || document).querySelector(sel);
        const qsa = (sel, ctx) => (ctx || document).querySelectorAll(sel);

        const sidebar = $('sidebar');
        const sidebarToggleBtn = $('sidebarToggleBtn');
        const sidebarOpenBtn = $('sidebarOpenBtn');
        const sidebarOverlay = $('sidebarOverlay');
        const newChatBtn = $('newChatBtn');
        const chatHistory = $('chatHistory');
        const emptyHistory = $('emptyHistory');
        const messagesContainer = $('messagesContainer');
        const emptyState = $('emptyState');
        const userInput = $('userInput');
        const sendBtn = $('sendBtn');
        const stopBtn = $('stopBtn');
        const attachBtn = $('attachBtn');
        const fileInput = $('fileInput');
        const attachmentPreviews = $('attachmentPreviews');
        const microphoneBtn = $('microphoneBtn');
        const scrollBottomBtn = $('scrollBottomBtn');
        const chatTitle = $('chatTitle');
        const accountBtn = $('accountBtn');
        const settingsIcon = $('settingsIcon');
        const avatarDisplay = $('avatarDisplay');
        const userNameDisplay = $('userNameDisplay');
        const userEmailDisplay = $('userEmailDisplay');

        // Modals
        const accountModal = $('accountModal');
        const modalCloseBtn = $('modalCloseBtn');
        const modalTitle = $('modalTitle');
        const modalDesc = $('modalDesc');
        const modalName = $('modalName');
        const modalEmail = $('modalEmail');
        const modalPassword = $('modalPassword');
        const modalError = $('modalError');
        const modalSubmitBtn = $('modalSubmitBtn');
        const modalSwitchBtn = $('modalSwitchBtn');
        const modalGuestBtn = $('modalGuestBtn');
        const nameField = $('nameField');

        const settingsModal = $('settingsModal');
        const settingsCloseBtn = $('settingsCloseBtn');
        const settingsCloseActionBtn = $('settingsCloseActionBtn');
        const themeSelect = $('themeSelect');
        const enterSendSelect = $('enterSendSelect');
        const settingsSaveBtn = $('settingsSaveBtn');

        const toastContainer = $('toastContainer');

        // ============================================================
        // STORAGE
        // ============================================================
        const Storage = {
            get(key) {
                try {
                    const raw = localStorage.getItem('agrideepai_' + key);
                    return raw ? JSON.parse(raw) : null;
                } catch { return null; }
            },
            set(key, value) {
                try {
                    localStorage.setItem('agrideepai_' + key, JSON.stringify(value));
                } catch { /* ignore */ }
            },
            remove(key) {
                localStorage.removeItem('agrideepai_' + key);
            }
        };

        // ============================================================
        // TOAST SYSTEM
        // ============================================================
        function showToast(message, type = 'info', duration = 3000) {
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                <span class="toast-msg">${message}</span>
                <button class="toast-dismiss" aria-label="Dismiss">✕</button>
            `;
            toastContainer.appendChild(toast);

            toast.querySelector('.toast-dismiss').addEventListener('click', () => dismissToast(toast));

            setTimeout(() => dismissToast(toast), duration);
        }

        function dismissToast(toast) {
            toast.classList.add('hiding');
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 300);
        }

        // ============================================================
        // MODAL HELPERS
        // ============================================================
        function openModal(modal) {
            modal.classList.add('active');
        }

        function closeModal(modal) {
            modal.classList.remove('active');
        }

        function openAccountModal(mode) {
            const isSignUp = mode === 'signup';
            modalError.classList.remove('visible');
            modalName.value = '';
            modalEmail.value = '';
            modalPassword.value = '';

            if (isSignUp) {
                modalTitle.textContent = 'Create Account';
                modalDesc.textContent = 'Join AgriDeepAI to save your chats.';
                nameField.style.display = 'block';
                modalSubmitBtn.textContent = 'Sign Up';
                modalSwitchBtn.textContent = 'Already have an account? Sign In';
            } else {

        // ============================================================
        // CHAT FUNCTIONS
        // ============================================================
        function generateId() {
            return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        }

        function createConversation(title) {
            const id = 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            state.conversations[id] = {
                id: id,
                title: title || 'New Chat',
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now()
            };
            return id;
        }

        function getCurrentConversation() {
            if (!state.currentConversationId) return null;
            return state.conversations[state.currentConversationId] || null;
        }

        function addMessage(conversationId, role, content) {
            const conv = state.conversations[conversationId];
            if (!conv) return null;
            const msg = {
                id: generateId(),
                role: role,
                content: content,
                createdAt: Date.now()
            };
            conv.messages.push(msg);
            conv.updatedAt = Date.now();
            return msg;
        }

        function switchConversation(id) {
            state.currentConversationId = id;
            renderConversation(id);
            updateChatHistory();
            const conv = state.conversations[id];
            if (conv) chatTitle.textContent = conv.title;
            if (window.innerWidth <= 992) closeSidebar();
        }

        function renderConversation(id) {
            const conv = state.conversations[id];
            if (!conv) return;

            // Clear messages (keep empty state)
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            wrappers.forEach(el => el.remove());

            if (conv.messages.length === 0) {
                emptyState.classList.remove('hidden');
                scrollBottomBtn.classList.remove('visible');
                return;
            }

            emptyState.classList.add('hidden');

            conv.messages.forEach(msg => {
                appendMessageToDOM(msg.content, msg.role, false);
            });

            // Update scroll button
            updateScrollButton();
            scrollToBottom(false);
        }

        function appendMessageToDOM(content, role, isLoading) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + role;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isLoading) {
                bubble.innerHTML = '<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
                wrapper.dataset.loading = 'true';
            } else {
                // Simple text — we'll support markdown in Phase 2
                bubble.textContent = content;
            }

            wrapper.appendChild(bubble);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'message-actions';

            if (role === 'user') {
                actions.innerHTML = `
                    <button data-action="copy" title="Copy">📋</button>
                    <button data-action="edit" title="Edit">✏️</button>
                `;
            } else {
                actions.innerHTML = `
                    <button data-action="copy" title="Copy">📋</button>
                    <button data-action="regenerate" title="Regenerate">🔄</button>
                    <button data-action="like" title="Like">👍</button>
                    <button data-action="dislike" title="Dislike">👎</button>
                `;
            }

            actions.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const msgText = bubble.textContent;

                    if (action === 'copy') {
                        navigator.clipboard.writeText(msgText).then(() => {
                            btn.textContent = '✅';
                            btn.classList.add('copied');
                            setTimeout(() => {
                                btn.textContent = '📋';
                                btn.classList.remove('copied');
                            }, 2000);
                            showToast('Copied to clipboard!', 'success');
                        }).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = msgText;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            btn.textContent = '✅';
                            setTimeout(() => btn.textContent = '📋', 2000);
                            showToast('Copied to clipboard!', 'success');
                        });
                    } else if (action === 'edit' && role === 'user') {
                        startEdit(wrapper, msgText);
                    } else if (action === 'regenerate' && role === 'bot') {
                        const conv = getCurrentConversation();
                        if (conv) {
                            // Find last user message
                            const lastUser = conv.messages.filter(m => m.role === 'user').pop();
                            if (lastUser) {
                                // Remove this bot message and regenerate
                                const idx = conv.messages.indexOf(
                                    conv.messages.find(m => m.id === wrapper.dataset.msgId)
                                );
                                if (idx > -1) conv.messages.splice(idx, 1);
                                wrapper.remove();
                                sendMessage(lastUser.content);
                            }
                        }
                    } else if (action === 'like') {
                        btn.classList.toggle('liked');
                    } else if (action === 'dislike') {
                        btn.classList.toggle('disliked');
                    }
                });
            });

            wrapper.appendChild(actions);
            messagesContainer.appendChild(wrapper);
            return wrapper;
        }

        function startEdit(wrapper, originalText) {
            const bubble = wrapper.querySelector('.message-bubble');
            const actions = wrapper.querySelector('.message-actions');
            bubble.style.display = 'none';
            actions.style.display = 'none';

            const editDiv = document.createElement('div');
            editDiv.className = 'edit-container';
            editDiv.innerHTML = `
                <textarea class="edit-input">${originalText}</textarea>
                <div class="edit-actions">
                    <button class="save-edit">Save</button>
                    <button class="cancel-edit">Cancel</button>
                </div>
            `;
            wrapper.appendChild(editDiv);

            const textarea = editDiv.querySelector('.edit-input');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            editDiv.querySelector('.save-edit').addEventListener('click', function() {
                const newText = textarea.value.trim();
                if (newText) {
                    const conv = getCurrentConversation();
                    if (conv) {
                        // Find and update message
                        const msg = conv.messages.find(m => m.content === originalText && m.role === 'user');
                        if (msg) {
                            msg.content = newText;
                            // Remove all subsequent bot messages
                            const idx = conv.messages.indexOf(msg);
                            conv.messages = conv.messages.slice(0, idx + 1);
                            // Remove all bot messages after this
                            // Actually we need to be more careful — but for simplicity, remove all after user
                            // We'll just keep the user message and re-send
                            renderConversation(state.currentConversationId);
                            // Re-send the edited message
                            sendMessage(newText);
                        }
                    }
                }
            });

            editDiv.querySelector('.cancel-edit').addEventListener('click', function() {
                bubble.style.display = '';
                actions.style.display = '';
                editDiv.remove();
            });
        }

        function updateChatHistory() {
            // Clear history list
            const items = chatHistory.querySelectorAll('.chat-item');
            items.forEach(el => el.remove());

            const emptyEl = chatHistory.querySelector('.empty-history');
            if (emptyEl) emptyEl.remove();

            const convs = Object.values(state.conversations);
            if (convs.length === 0) {
                chatHistory.innerHTML =
                    '<div class="empty-history" id="emptyHistory">No chats yet.<br />Start a new conversation!</div>';
                return;
            }

            // Sort by pinned first, then updatedAt
            convs.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return b.updatedAt - a.updatedAt;
            });

            convs.forEach(conv => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (conv.id === state.currentConversationId ? ' active' : '');
                div.dataset.chatId = conv.id;

                const title = conv.title || 'New Chat';
                const isPinned = conv.pinned || false;

                div.innerHTML = `
                    <span class="title">${title}</span>
                    <div class="chat-actions">
                        <button class="pin-btn ${isPinned ? 'pinned' : ''}" data-action="pin" title="Pin chat">📌</button>
                        <button data-action="delete" title="Delete chat">🗑️</button>
                        <button data-action="share" title="Share chat">🔗</button>
                    </div>
                `;

                div.addEventListener('click', function(e) {
                    if (e.target.closest('button')) return;
                    switchConversation(conv.id);
                });

                div.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'delete') deleteConversation(conv.id);
                        else if (action === 'pin') togglePin(conv.id);
                        else if (action === 'share') shareConversation(conv.id);
                    });
                });

                chatHistory.appendChild(div);
            });
        }

        function deleteConversation(id) {
            if (!confirm('Delete this conversation?')) return;
            const conv = state.conversations[id];
            if (!conv) return;

            delete state.conversations[id];
            if (state.currentConversationId === id) {
                state.currentConversationId = null;
                chatTitle.textContent = APP_CONFIG.appName;
                // Clear messages
                const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
                wrappers.forEach(el => el.remove());
                emptyState.classList.remove('hidden');
                scrollBottomBtn.classList.remove('visible');
            }
            updateChatHistory();
            showToast('Conversation deleted.', 'info');
        }

        function togglePin(id) {
            const conv = state.conversations[id];
            if (!conv) return;
            conv.pinned = !conv.pinned;
            updateChatHistory();
            // Keep current conversation active
            if (state.currentConversationId) {
                const el = chatHistory.querySelector(`.chat-item[data-chat-id="${state.currentConversationId}"]`);
                if (el) el.classList.add('active');
            }
            showToast(conv.pinned ? 'Pinned.' : 'Unpinned.', 'info');
        }

        function shareConversation(id) {
            const conv = state.conversations[id];
            if (!conv || conv.messages.length === 0) {
                showToast('No messages to share.', 'warning');
                return;
            }
            const text = conv.messages.map(m => (m.role === 'user' ? '👤 ' : '🌾 ') + m.content).join('\n\n');
            if (navigator.share) {
                navigator.share({ title: 'AgriDeepAI Chat', text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Chat copied to clipboard!', 'success');
                }).catch(() => {
                    prompt('Copy this chat:', text);
                });
            }
        }

        // ============================================================
        // SCROLL HANDLING
        // ============================================================
        let userScrolledUp = false;

        messagesContainer.addEventListener('scroll', function() {
            const atBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 10;
            if (atBottom) {
                userScrolledUp = false;
                scrollBottomBtn.classList.remove('visible');

        function updateScrollButton() {
            const atBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer
                .clientHeight < 10;

        // ============================================================
        // SEND / STOP
        // ============================================================
        async function sendMessage(text) {
            if (state.isGenerating) return;
            const message = text || userInput.value.trim();
            if (!message) return;

            // Ensure we have a conversation
            if (!state.currentConversationId) {
                const newId = createConversation(message.slice(0, 30) + (message.length > 30 ? '...' : ''));
                state.currentConversationId = newId;
                updateChatHistory();
                const conv = state.conversations[newId];
                if (conv) chatTitle.textContent = conv.title;
                emptyState.classList.add('hidden');
            }

            const conv = getCurrentConversation();
            if (!conv) return;

            // Add user message
            addMessage(conv.id, 'user', message);
            appendMessageToDOM(message, 'user', false);

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.classList.remove('visible');

            // Show loading
            state.isGenerating = true;
            stopBtn.classList.add('active');
            const loadingWrapper = appendMessageToDOM('', 'bot', true);

            // Abort controller for stop
            state.abortController = new AbortController();

            try {
                // Simulate AI response (Phase 2 will connect to real backend)
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Demo response — replace with real API in Phase 2
                const demoResponses = [
                    "That's a great question about agriculture in Rwanda. Let me provide some insights based on current agricultural practices...",
                    "For livestock farming in Rwanda, there are several key considerations to keep in mind...",
                    "Crop diseases can be managed effectively with early detection and proper treatment methods...",
                    "Let me share some information about sustainable farming techniques that work well in East Africa...",
                    "Agricultural challenges in Rwanda are often addressed through government programs and community initiatives..."
                ];
                const demo = demoResponses[Math.floor(Math.random() * demoResponses.length)];

                // Simulate streaming
                state.isStreaming = true;
                let response = '';
                const words = demo.split(' ');
                for (let i = 0; i < words.length; i++) {
                    if (state.abortController.signal.aborted) break;
                    response += (i === 0 ? '' : ' ') + words[i];
                    if (loadingWrapper) {
                        const bubble = loadingWrapper.querySelector('.message-bubble');
                        if (bubble) bubble.textContent = response + ' ▍';
                    }
                    await new Promise(r => setTimeout(r, 30 + Math.random() * 40));
                }

                state.isStreaming = false;

                if (state.abortController.signal.aborted) {
                    // Generation stopped
                    if (loadingWrapper) {
                        const bubble = loadingWrapper.querySelector('.message-bubble');
                        if (bubble) bubble.textContent = response + ' [stopped]';
                    }
                    addMessage(conv.id, 'bot', response + ' [stopped]');
                } else {
                    // Final response
                    if (loadingWrapper) {
                        const bubble = loadingWrapper.querySelector('.message-bubble');
                        if (bubble) bubble.textContent = response;
                        loadingWrapper.dataset.loading = 'false';
                    }
                    addMessage(conv.id, 'bot', response);
                }

            } catch (error) {
                showToast('Error generating response.', 'error');
                if (loadingWrapper) {
                    const bubble = loadingWrapper.querySelector('.message-bubble');
                    if (bubble) bubble.textContent = 'Sorry, an error occurred. Please try again.';
                }
                addMessage(conv.id, 'bot', 'Sorry, an error occurred. Please try again.');
            }

            state.isGenerating = false;
            state.isStreaming = false;
            stopBtn.classList.remove('active');
            sendBtn.classList.remove('visible');

            // Update chat history
            updateChatHistory();
            // Update scroll
            updateScrollButton();
            if (!userScrolledUp) scrollToBottom(true);
        }

        function stopGeneration() {
            if (state.isGenerating && state.abortController) {
                state.abortController.abort();
                state.isGenerating = false;
                state.isStreaming = false;
                stopBtn.classList.remove('active');
                showToast('Generation stopped.', 'info');
            }
        }

                if (state.enterToSend) {
                    e.preventDefault();

            }
            if (e.key === 'Enter' && e.shiftKey) {
                // Allow newline

            }
