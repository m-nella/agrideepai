<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌾 AgriDeepAI</title>
    <style>
        /* Reset and base */
        html,
        body {
            background: #1e1e1f !important;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            background: #1e1e1f !important;
            margin: 0;
            padding: 0;
        }

        .agent-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: #1e1e1f !important;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .agent-container iframe {
            display: block;
            width: 100%;
            height: 100%;
            flex: 1;
            border: none;
            background: #1e1e1f !important;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1e1e1f !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 16px;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #2d2d30;
            border-top-color: #ececf1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            color: #6e6e72;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== FOOTER COVER (Hides Taskade Watermark) ===== */
        .footer-cover {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: #1e1e1f !important;
            z-index: 30;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            cursor: default;
            touch-action: none;
            -webkit-touch-callout: none;
            opacity: 1;
            box-shadow: none;
            border: none;
        }

        .footer-blocker {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            z-index: 31;
            background: transparent;
            pointer-events: auto;
            cursor: default;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div class="agent-container" id="agentContainer">
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading AgriDeepAI...</div>
        </div>

        <!-- Footer covers (Hides watermark and bottom UI) -->
        <div class="footer-cover"></div>
        <div class="footer-blocker"></div>

        <!-- The AgriDeepAI Agent Iframe -->
        <iframe
            id="agentFrame"
            src="https://www.taskade.com/a/01M1HASACJHWBH5VQ8WZ8B1PH9"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </div>

    <script>
        const AGENT_URL = "https://www.taskade.com/a/01M1HASACJHWBH5VQ8WZ8B1PH9";

        function handleLoading() {
            const overlay = document.getElementById('loadingOverlay');
            const iframe = document.getElementById('agentFrame');

            overlay.classList.remove('hidden');

            iframe.addEventListener('load', function () {
                setTimeout(() => {
                    overlay.classList.add('hidden');
                }, 500);
                // Try to force iframe background (optional, may not work due to CORS)
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow?.document;
                    if (doc && doc.body) {
                        doc.body.style.background = '#1e1e1f';
                        doc.documentElement.style.background = '#1e1e1f';
                    }
                } catch (e) {
                    // Cross-origin error is expected, ignore it
                }
            });

            // Safety fallback: hide overlay after 3 seconds even if iframe load doesn't fire
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', function () {
            handleLoading();
        });

        window.addEventListener('load', function () {
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1000);
        });
    </script>
</body>
</html>
