<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AgriDeepAI</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-primary: #0e0e0e;
            --bg-secondary: #171717;
            --bg-sidebar: #0f0f0f;
            --bg-hover: #252525;
            --bg-input: #1f1f1f;
            --bg-user-msg: #1a6bff;
            --bg-bot-msg: #252525;
            --text-primary: #f0f0f0;
            --text-secondary: #a8a8a8;
            --text-muted: #5c5c5c;
            --border-color: #2a2a2a;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
            --radius: 12px;
            --transition: 0.2s ease;
            --sidebar-width: 280px;
            --header-height: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ===== APP LAYOUT ===== */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: var(--bg-primary);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform var(--transition);
            z-index: 200;
            overflow: hidden;
            position: relative;
        }
        .sidebar.closed {
            transform: translateX(-100%);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: var(--sidebar-width);
        }

        /* Sidebar Header */
        .sidebar-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .sidebar-header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-header .brand img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }
        .sidebar-header .brand span {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .sidebar-header .brand span.green {
            color: var(--accent-green);
        }
        .sidebar-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
            border-radius: 6px;
            transition: var(--transition);
            line-height: 1;
        }
        .sidebar-close-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* New Chat Button */
        .new-chat-btn {
            margin: 12px 16px;
            padding: 12px 16px;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-shrink: 0;
        }
        .new-chat-btn:hover {
            background: #2563eb;
        }
        .new-chat-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Chat History */
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
        .chat-item {
            padding: 10px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            position: relative;
        }
        .chat-item:hover {
            background: var(--bg-hover);
        }
        .chat-item.active {
            background: var(--bg-hover);
        }
        .chat-item .title {
            font-size: 14px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 8px;
        }
        .chat-item .chat-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--transition);
        }
        .chat-item:hover .chat-actions {
            opacity: 1;
        }
        .chat-item .chat-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .chat-item .chat-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .chat-item .chat-actions button.pin-btn.pinned {
            color: #f59e0b;
        }
        .empty-history {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 40px 16px;
        }

        /* Sidebar Footer - Account */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .account-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            text-align: left;
        }
        .account-btn:hover {
            background: var(--bg-hover);
        }
        .account-btn .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .account-btn .info {
            flex: 1;
            min-width: 0;
        }
        .account-btn .info .name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .account-btn .info .email {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .account-btn .settings-icon {
            color: var(--text-muted);
            font-size: 18px;
            transition: var(--transition);
        }
        .account-btn:hover .settings-icon {
            color: var(--text-primary);
        }
        .account-btn .login-status {
            font-size: 13px;
            color: var(--accent-blue);
            font-weight: 500;
        }

        /* ===== MAIN CHAT AREA ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh;
            position: relative;
            min-width: 0;
        }

        /* Main Chat Header */
        .chat-header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-primary);
        }
        .chat-header .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 24px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
            line-height: 1;
            display: none;
        }
        .chat-header .toggle-sidebar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .chat-header .chat-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 100px 32px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        .messages-container::-webkit-scrollbar {
            width: 4px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        .empty-state .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .empty-state h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .empty-state h1 .green {
            color: var(--accent-green);
        }
        .empty-state .subtitle {
            font-size: 16px;
            color: var(--text-muted);
            max-width: 420px;
            line-height: 1.6;
            margin-top: 4px;
        }
        .empty-state .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px;
            justify-content: center;
        }
        .empty-state .suggestions button {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .empty-state .suggestions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }
        .empty-state.hidden {
            display: none;
        }

        /* Messages */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
            max-width: 85%;
        }
        .message-wrapper.user {
            align-self: flex-end;
        }
        .message-wrapper.bot {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.7;
            position: relative;
            word-wrap: break-word;
            max-width: 100%;
        }
        .message-wrapper.user .message-bubble {
            background: var(--bg-user-msg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.bot .message-bubble {
            background: var(--bg-bot-msg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        .message-wrapper.bot .message-bubble .loading-dots span {
            animation: pulse 1.2s infinite;
            display: inline-block;
        }
        .message-wrapper.bot .message-bubble .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .message-wrapper.bot .message-bubble .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Message Actions */
        .message-actions {
            display: flex;
            gap: 2px;
            margin-top: 6px;
            opacity: 0;
            transition: var(--transition);
            flex-wrap: wrap;
        }
        .message-wrapper:hover .message-actions,
        .message-wrapper:focus-within .message-actions {
            opacity: 1;
        }
        .message-wrapper.user .message-actions {
            justify-content: flex-end;
        }
        .message-wrapper.bot .message-actions {
            justify-content: flex-start;
        }
        .message-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            transition: var(--transition);
            font-family: inherit;
            line-height: 1;
        }
        .message-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .message-actions button.liked {
            color: var(--accent-blue);
        }
        .message-actions button.disliked {
            color: #ef4444;
        }

        /* Edit Input */
        .edit-container {
            width: 100%;
            margin-top: 6px;
        }
        .edit-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            min-height: 40px;
        }
        .edit-input:focus {
            border-color: var(--accent-blue);
        }
        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .edit-actions button {
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: var(--transition);
        }
        .edit-actions .save-edit {
            background: var(--accent-blue);
            color: #fff;
        }
        .edit-actions .save-edit:hover {
            background: #2563eb;
        }
        .edit-actions .cancel-edit {
            background: var(--bg-hover);
            color: var(--text-secondary);
        }
        .edit-actions .cancel-edit:hover {
            background: #333;
        }

        /* ===== INPUT AREA ===== */
        .input-wrapper {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 32px 24px 32px;
            background: linear-gradient(to top, var(--bg-primary) 60%, transparent);
            flex-shrink: 0;
        }
        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 6px 8px 6px 16px;
            transition: var(--transition);
            max-width: 900px;
            margin: 0 auto;
        }
        .input-container:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 1px var(--accent-blue);
        }
        .input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            padding: 10px 0;
            resize: none;
            min-height: 24px;
            max-height: 200px;
            line-height: 1.5;
        }
        .input-container textarea::placeholder {
            color: var(--text-muted);
        }
        .input-container .input-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .input-container .input-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            position: relative;
        }
        .input-container .input-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .input-container .input-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .input-container .input-actions .send-btn {
            background: var(--accent-blue);
            color: #fff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .input-container .input-actions .send-btn.visible {
            display: flex;
        }
        .input-container .input-actions .send-btn:hover {
            background: #2563eb;
        }
        .input-container .input-actions .stop-btn {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .input-container .input-actions .stop-btn.active {
            display: flex;
        }
        .input-container .input-actions .stop-btn:hover {
            background: #333;
        }
        .file-input {
            display: none;
        }

        /* Tooltip via title attribute already works */

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .modal-box p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 14px;
        }
        .modal-box .field {
            margin-bottom: 16px;
        }
        .modal-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal-box .field input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .modal-box .field input:focus {
            border-color: var(--accent-blue);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-box .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            min-width: 80px;
        }
        .modal-box .modal-actions .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }
        .modal-box .modal-actions .btn-primary:hover {
            background: #2563eb;
        }
        .modal-box .modal-actions .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .modal-box .modal-actions .btn-secondary:hover {
            background: #333;
        }
        .modal-box .modal-actions .btn-ghost {
            background: transparent;
            color: var(--text-muted);
        }
        .modal-box .modal-actions .btn-ghost:hover {
            color: var(--text-primary);
        }
        .modal-box .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        .modal-box .error-msg.visible {
            display: block;
        }
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover {
            color: var(--text-primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                transform: translateX(-100%);
                z-index: 300;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .chat-header .toggle-sidebar-btn {
                display: block;
            }
            .chat-header .chat-title {
                font-size: 14px;
            }
            .messages-container {
                padding: 16px 16px 80px 16px;
            }
            .input-wrapper {
                padding: 8px 16px 16px 16px;
            }
            .empty-state h1 {
                font-size: 24px;
            }
            .empty-state .logo {
                width: 64px;
                height: 64px;
            }
            .message-wrapper {
                max-width: 95%;
            }
        }

        @media (max-width: 600px) {
            .messages-container {
                padding: 12px 12px 70px 12px;
            }
            .message-bubble {
                font-size: 14px;
                padding: 10px 14px;
                border-radius: 14px;
            }
            .input-wrapper {
                padding: 6px 12px 12px 12px;
            }
            .input-container {
                padding: 4px 6px 4px 12px;
                border-radius: 14px;
            }
            .input-container textarea {
                font-size: 14px;
                padding: 8px 0;
                min-height: 20px;
            }
            .input-container .input-actions button {
                width: 32px;
                height: 32px;
                font-size: 16px;
                padding: 4px;
            }
            .input-container .input-actions .send-btn,
            .input-container .input-actions .stop-btn {
                width: 32px;
                height: 32px;
            }
            .empty-state .logo {
                width: 50px;
                height: 50px;
            }
            .empty-state h1 {
                font-size: 20px;
            }
            .empty-state .subtitle {
                font-size: 14px;
            }
            .empty-state .suggestions button {
                font-size: 12px;
                padding: 6px 12px;
            }
            .sidebar {
                width: 280px;
            }
            .chat-header {
                padding: 0 12px;
                height: 48px;
            }
            .chat-header .toggle-sidebar-btn {
                font-size: 20px;
                padding: 4px;
            }
            .modal-box {
                padding: 24px;
                max-width: 360px;
            }
        }

        @media (max-width: 400px) {
            .messages-container {
                padding: 8px 8px 60px 8px;
            }
            .message-bubble {
                font-size: 13px;
                padding: 8px 12px;
            }
            .input-container textarea {
                font-size: 13px;
            }
            .empty-state h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            .messages-container {
                padding: 12px 16px 70px 16px;
            }
            .empty-state .logo {
                width: 48px;
                height: 48px;
            }
            .empty-state h1 {
                font-size: 20px;
            }
            .sidebar {
                width: 240px;
            }
        }

        /* Touch devices - keep actions visible */
        @media (hover: none) {
            .message-actions {
                opacity: 1;
            }
            .chat-item .chat-actions {
                opacity: 1;
            }
        }

        /* Light mode support */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-primary: #f7f7f7;
                --bg-secondary: #ffffff;
                --bg-sidebar: #f0f0f0;
                --bg-hover: #e5e5e5;
                --bg-input: #e8e8e8;
                --bg-bot-msg: #e8e8e8;
                --bg-user-msg: #1a6bff;
                --text-primary: #1a1a1a;
                --text-secondary: #4a4a4a;
                --text-muted: #888888;
                --border-color: #d0d0d0;
            }
            .message-wrapper.user .message-bubble {
                color: #fff;
            }
            .message-wrapper.bot .message-bubble {
                color: #1a1a1a;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== SCROLLBAR OVERRIDES ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="brand">
                    <img src="logo.png" alt="AgriDeepAI Logo" id="sidebarLogo" />
                    <span>Agri<span class="green">DeepAI</span></span>
                </div>
                <button class="sidebar-close-btn" id="closeSidebarBtn" title="Close sidebar">✕</button>
            </div>

            <!-- New Chat Button -->
            <button class="new-chat-btn" id="newChatBtn" title="Start a new conversation">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Chat
            </button>

            <!-- Chat History -->
            <div class="chat-history" id="chatHistory">
                <div class="empty-history" id="emptyHistory">No chats yet.<br />Start a new conversation!</div>
            </div>

            <!-- Sidebar Footer: Account -->
            <div class="sidebar-footer">
                <button class="account-btn" id="accountBtn">
                    <div class="avatar" id="avatarDisplay">👤</div>
                    <div class="info">
                        <div class="name" id="userNameDisplay">Guest</div>
                        <div class="email" id="userEmailDisplay">Not signed in</div>
                    </div>
                    <span class="settings-icon" id="settingsIcon">⚙️</span>
                </button>
            </div>
        </aside>

        <!-- ===== MAIN CHAT ===== -->
        <main class="main-chat">

            <!-- Chat Header -->
            <div class="chat-header">
                <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Open sidebar">☰</button>
                <span class="chat-title" id="chatTitle">AgriDeepAI</span>
            </div>

            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <img src="logo.png" alt="AgriDeepAI" class="logo" id="emptyLogo" />
                    <h1>Agri<span class="green">DeepAI</span></h1>
                    <div class="subtitle">Your AI assistant for agriculture, livestock. Where should we start today?</div>
                    <div class="suggestions">
                        <button data-suggestion="What are the best crops to grow in Rwanda?">🌱 Best crops in Rwanda</button>
                        <button data-suggestion="How to treat maize leaf disease?">🌽 Maize disease treatment</button>
                        <button data-suggestion="What is the best fertilizer for potatoes?">🥔 Best fertilizer</button>
                        <button data-suggestion="Tell me about livestock farming in Rwanda">🐄 Livestock farming</button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea id="userInput" rows="1" placeholder="Ask me about agriculture and livestock..."></textarea>
                    <div class="input-actions">
                        <button id="fileUploadBtn" title="Attach file or image">📎</button>
                        <input type="file" id="fileInput" class="file-input" accept="image/*,.pdf,.doc,.docx,.txt" multiple />
                        <button class="stop-btn" id="stopBtn" title="Stop generating">⏹️</button>
                        <button class="send-btn" id="sendBtn" title="Send message">➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== ACCOUNT MODAL ===== -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <h2 id="modalTitle">Sign In</h2>
            <p id="modalDesc">Sign in to your account to save chats and access your history.</p>
            <div id="modalFields">
                <div class="field" id="nameField" style="display:none;">
                    <label for="modalName">Full Name</label>
                    <input type="text" id="modalName" placeholder="Your name" />
                </div>
                <div class="field">
                    <label for="modalEmail">Email</label>
                    <input type="email" id="modalEmail" placeholder="you@example.com" />
                </div>
                <div class="field">
                    <label for="modalPassword">Password</label>
                    <input type="password" id="modalPassword" placeholder="••••••••" />
                </div>
                <div class="error-msg" id="modalError">Invalid credentials.</div>
            </div>
            <div class="modal-actions">
                <button class="btn-primary" id="modalSubmitBtn">Sign In</button>
                <button class="btn-secondary" id="modalSwitchBtn">Create Account</button>
                <button class="btn-ghost" id="modalGuestBtn">Continue as Guest</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DOM REFS
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const emptyState = document.getElementById('emptyState');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const stopBtn = document.getElementById('stopBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatHistory = document.getElementById('chatHistory');
        const emptyHistory = document.getElementById('emptyHistory');
        const fileUploadBtn = document.getElementById('fileUploadBtn');
        const fileInput = document.getElementById('fileInput');
        const accountBtn = document.getElementById('accountBtn');
        const settingsIcon = document.getElementById('settingsIcon');
        const avatarDisplay = document.getElementById('avatarDisplay');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userEmailDisplay = document.getElementById('userEmailDisplay');
        const chatTitle = document.getElementById('chatTitle');

        // Modal
        const modal = document.getElementById('accountModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalName = document.getElementById('modalName');
        const modalEmail = document.getElementById('modalEmail');
        const modalPassword = document.getElementById('modalPassword');
        const modalError = document.getElementById('modalError');
        const modalSubmitBtn = document.getElementById('modalSubmitBtn');
        const modalSwitchBtn = document.getElementById('modalSwitchBtn');
        const modalGuestBtn = document.getElementById('modalGuestBtn');
        const nameField = document.getElementById('nameField');

        // ============================================================
        // STATE
        // ============================================================
        let currentChatId = null;
        let chatHistoryData = {};
        let isGenerating = false;
        let currentLoadingElement = null;
        let chatCounter = 0;
        let currentUser = null;
        let isSignUpMode = false;

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        function openSidebar() {
            if (window.innerWidth <= 992) {
                sidebar.classList.add('open');
            } else {
                sidebar.classList.remove('closed');
            }
        }

        function closeSidebar() {
            if (window.innerWidth <= 992) {
                sidebar.classList.remove('open');
            } else {
                sidebar.classList.add('closed');
            }
        }

        function toggleSidebar() {
            if (window.innerWidth <= 992) {
                if (sidebar.classList.contains('open')) closeSidebar();
                else openSidebar();
            } else {
                if (sidebar.classList.contains('closed')) openSidebar();
                else closeSidebar();
            }
        }

        // Show toggle button when sidebar is closed on desktop
        function updateToggleButtonVisibility() {
            if (window.innerWidth <= 992) {
                toggleSidebarBtn.style.display = 'block';
            } else {
                if (sidebar.classList.contains('closed')) {
                    toggleSidebarBtn.style.display = 'block';
                } else {
                    toggleSidebarBtn.style.display = 'none';
                }
            }
        }

        toggleSidebarBtn.addEventListener('click', toggleSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', function(e) {
            if (window.innerWidth <= 992 && sidebar.classList.contains('open')) {
                if (!sidebar.contains(e.target) && e.target !== toggleSidebarBtn) {
                    closeSidebar();
                }
            }
        });

        // Handle resize
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(updateToggleButtonVisibility, 200);
        });

        // Initial state
        if (window.innerWidth <= 992) {
            sidebar.classList.add('closed');
            sidebar.classList.remove('open');
            toggleSidebarBtn.style.display = 'block';
        } else {
            sidebar.classList.remove('closed');
            toggleSidebarBtn.style.display = 'none';
        }

        // ============================================================
        // ACCOUNT SYSTEM (Phase 6 placeholder with modal)
        // ============================================================
        function updateUIForUser(user) {
            if (user) {
                const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
                avatarDisplay.textContent = initial;
                userNameDisplay.textContent = user.name || 'User';
                userEmailDisplay.textContent = user.email || 'signed in';
            } else {
                avatarDisplay.textContent = '👤';
                userNameDisplay.textContent = 'Guest';
                userEmailDisplay.textContent = 'Not signed in';
            }
        }

        function openModal(mode) {
            isSignUpMode = (mode === 'signup');
            modal.classList.add('active');
            modalError.classList.remove('visible');
            modalName.value = '';
            modalEmail.value = '';
            modalPassword.value = '';

            if (isSignUpMode) {
                modalTitle.textContent = 'Create Account';
                modalDesc.textContent = 'Join AgriDeepAI to save your chats and personalize your experience.';
                nameField.style.display = 'block';
                modalSubmitBtn.textContent = 'Sign Up';
                modalSwitchBtn.textContent = 'Already have an account? Sign In';
            } else {
                modalTitle.textContent = 'Sign In';
                modalDesc.textContent = 'Sign in to your account to save chats and access your history.';
                nameField.style.display = 'none';
                modalSubmitBtn.textContent = 'Sign In';
                modalSwitchBtn.textContent = 'Create Account';
            }
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        modalSwitchBtn.addEventListener('click', function() {
            openModal(isSignUpMode ? 'signin' : 'signup');
        });

        modalGuestBtn.addEventListener('click', function() {
            closeModal();
            currentUser = null;
            localStorage.removeItem('agrideepai_user');
            updateUIForUser(null);
        });

        modalSubmitBtn.addEventListener('click', function() {
            const email = modalEmail.value.trim();
            const password = modalPassword.value.trim();
            if (!email || !password) {
                modalError.textContent = 'Please fill in all fields.';
                modalError.classList.add('visible');
                return;
            }
            if (isSignUpMode) {
                const name = modalName.value.trim() || 'User';
                // Simulate signup
                currentUser = { name: name, email: email };
                localStorage.setItem('agrideepai_user', JSON.stringify(currentUser));
                updateUIForUser(currentUser);
                closeModal();
                alert('Account created successfully! (Phase 6 will add real authentication)');
            } else {
                // Simulate signin
                currentUser = { name: 'User', email: email };
                localStorage.setItem('agrideepai_user', JSON.stringify(currentUser));
                updateUIForUser(currentUser);
                closeModal();
                alert('Signed in successfully! (Phase 6 will add real authentication)');
            }
        });

        // Account button click
        accountBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (currentUser) {
                // Show quick menu
                const action = confirm(
                    'Account: ' + currentUser.name + '\n' +
                    currentUser.email + '\n\n' +
                    'Click OK to Logout\n' +
                    'Click Cancel to stay signed in'
                );
                if (action) {
                    currentUser = null;
                    localStorage.removeItem('agrideepai_user');
                    updateUIForUser(null);
                    alert('Logged out.');
                }
            } else {
                openModal('signin');
            }
        });

        // Settings icon click (same as account)
        settingsIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            accountBtn.click();
        });

        // Load saved user
        try {
            const saved = localStorage.getItem('agrideepai_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                updateUIForUser(currentUser);
            }
        } catch (e) {}

        // ============================================================
        // CHAT FUNCTIONS
        // ============================================================
        function createChat(title) {
            const id = 'chat_' + (++chatCounter) + '_' + Date.now();
            chatHistoryData[id] = {
                id: id,
                title: title || 'New Chat',
                messages: [],
                pinned: false,
                createdAt: Date.now()
            };
            return id;
        }

        function addChatToHistory(id) {
            const emptyEl = document.getElementById('emptyHistory');
            if (emptyEl) emptyEl.remove();

            const chat = chatHistoryData[id];
            const div = document.createElement('div');
            div.className = 'chat-item active';
            div.dataset.chatId = id;

            div.innerHTML = `
                <span class="title">${chat.title}</span>
                <div class="chat-actions">
                    <button class="pin-btn" data-action="pin" title="Pin chat">📌</button>
                    <button data-action="delete" title="Delete chat">🗑️</button>
                    <button data-action="share" title="Share chat">🔗</button>
                </div>
            `;

            div.addEventListener('click', function(e) {
                if (e.target.closest('button')) return;
                switchChat(id);
            });

            div.querySelectorAll('button[data-action]').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    if (action === 'delete') deleteChat(id);
                    else if (action === 'pin') togglePin(id);
                    else if (action === 'share') shareChat(id);
                });
            });

            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function switchChat(id) {
            currentChatId = id;
            document.querySelectorAll('.chat-item').forEach(function(el) {
                el.classList.toggle('active', el.dataset.chatId === id);
            });
            renderMessages(id);
            if (window.innerWidth <= 992) closeSidebar();
            const chat = chatHistoryData[id];
            if (chat) chatTitle.textContent = chat.title;
        }

        function renderMessages(chatId) {
            const chat = chatHistoryData[chatId];
            if (!chat) return;

            // Clear messages (keep empty state)
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            wrappers.forEach(function(el) { el.remove(); });

            if (chat.messages.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            chat.messages.forEach(function(msg) {
                appendMessageToContainer(msg.text, msg.role, false);
            });
            scrollToBottom();
        }

        function appendMessageToContainer(text, role, isLoading) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + role;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isLoading) {
                bubble.innerHTML = '<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>';
                wrapper.dataset.loading = 'true';
                currentLoadingElement = wrapper;
            } else {
                bubble.textContent = text;
            }

            wrapper.appendChild(bubble);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'message-actions';

            if (role === 'user') {
                actions.innerHTML = `
                    <button title="Copy" data-action="copy">📋</button>
                    <button title="Edit" data-action="edit">✏️</button>
                `;
            } else {
                actions.innerHTML = `
                    <button title="Copy" data-action="copy">📋</button>
                    <button title="Share" data-action="share">🔗</button>
                    <button title="Like" data-action="like">👍</button>
                    <button title="Dislike" data-action="dislike">👎</button>
                `;
            }

            actions.querySelectorAll('button[data-action]').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const msgText = bubble.textContent;

                    if (action === 'copy') {
                        navigator.clipboard.writeText(msgText).then(function() {
                            btn.textContent = '✅';
                            setTimeout(function() { btn.textContent = '📋'; }, 2000);
                        }).catch(function() {
                            const ta = document.createElement('textarea');
                            ta.value = msgText;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            btn.textContent = '✅';
                            setTimeout(function() { btn.textContent = '📋'; }, 2000);
                        });
                    } else if (action === 'edit' && role === 'user') {
                        startEdit(wrapper, msgText);
                    } else if (action === 'share') {
                        if (navigator.share) {
                            navigator.share({ title: 'AgriDeepAI', text: msgText });
                        } else {
                            navigator.clipboard.writeText(msgText).then(function() {
                                alert('Message copied to clipboard!');
                            });
                        }
                    } else if (action === 'like') {
                        btn.classList.toggle('liked');
                    } else if (action === 'dislike') {
                        btn.classList.toggle('disliked');
                    }
                });
            });

            wrapper.appendChild(actions);
            messagesContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function startEdit(wrapper, originalText) {
            const bubble = wrapper.querySelector('.message-bubble');
            const actions = wrapper.querySelector('.message-actions');
            bubble.style.display = 'none';
            actions.style.display = 'none';

            const editDiv = document.createElement('div');
            editDiv.className = 'edit-container';
            editDiv.innerHTML = `
                <textarea class="edit-input">${originalText}</textarea>
                <div class="edit-actions">
                    <button class="save-edit">Save</button>
                    <button class="cancel-edit">Cancel</button>
                </div>
            `;
            wrapper.appendChild(editDiv);

            const textarea = editDiv.querySelector('.edit-input');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            editDiv.querySelector('.save-edit').addEventListener('click', function() {
                const newText = textarea.value.trim();
                if (newText) {
                    const chat = chatHistoryData[currentChatId];
                    if (chat) {
                        const idx = chat.messages.findIndex(function(m) {
                            return m.text === originalText && m.role === 'user';
                        });
                        if (idx !== -1) chat.messages[idx].text = newText;
                    }
                    bubble.textContent = newText;
                    bubble.style.display = '';
                    actions.style.display = '';
                    editDiv.remove();
                }
            });
            editDiv.querySelector('.cancel-edit').addEventListener('click', function() {
                bubble.style.display = '';
                actions.style.display = '';
                editDiv.remove();
            });
        }

        function deleteChat(chatId) {
            if (!confirm('Delete this chat?')) return;
            const el = document.querySelector('.chat-item[data-chat-id="' + chatId + '"]');
            if (el) el.remove();
            delete chatHistoryData[chatId];

            if (Object.keys(chatHistoryData).length === 0) {
                chatHistory.innerHTML = '<div class="empty-history" id="emptyHistory">No chats yet.<br />Start a new conversation!</div>';
                emptyState.classList.remove('hidden');
                currentChatId = null;
                chatTitle.textContent = 'AgriDeepAI';
            } else if (currentChatId === chatId) {
                const first = Object.keys(chatHistoryData)[0];
                switchChat(first);
            }
        }

        function togglePin(chatId) {
            const chat = chatHistoryData[chatId];
            if (!chat) return;
            chat.pinned = !chat.pinned;
            const el = document.querySelector('.chat-item[data-chat-id="' + chatId + '"]');
            if (el) {
                const pinBtn = el.querySelector('.pin-btn');
                if (pinBtn) pinBtn.classList.toggle('pinned', chat.pinned);
            }
            // Reorder pinned first
            const items = Array.from(chatHistory.querySelectorAll('.chat-item'));
            items.sort(function(a, b) {
                const aId = a.dataset.chatId;
                const bId = b.dataset.chatId;
                const aPinned = chatHistoryData[aId] ? chatHistoryData[aId].pinned : false;
                const bPinned = chatHistoryData[bId] ? chatHistoryData[bId].pinned : false;
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                return 0;
            });
            items.forEach(function(item) { chatHistory.appendChild(item); });
        }

        function shareChat(chatId) {
            const chat = chatHistoryData[chatId];
            if (!chat || chat.messages.length === 0) {
                alert('No messages to share.');
                return;
            }
            const text = chat.messages.map(function(m) {
                return (m.role === 'user' ? '👤 ' : '🌾 ') + m.text;
            }).join('\n\n');
            if (navigator.share) {
                navigator.share({ title: 'AgriDeepAI Chat', text: text });
            } else {
                navigator.clipboard.writeText(text).then(function() {
                    alert('Chat copied to clipboard!');
                });
            }
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============================================================
        // SEND / STOP
        // ============================================================
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            if (!currentChatId) {
                const newId = createChat(text.slice(0, 30) + (text.length > 30 ? '...' : ''));
                addChatToHistory(newId);
                currentChatId = newId;
                emptyState.classList.add('hidden');
                chatTitle.textContent = chatHistoryData[newId].title;
            }

            // Add user message
            appendMessageToContainer(text, 'user', false);
            const chat = chatHistoryData[currentChatId];
            if (chat) {
                chat.messages.push({ role: 'user', text: text });
                if (chat.messages.length === 1) {
                    chat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
                    const el = document.querySelector('.chat-item[data-chat-id="' + currentChatId + '"]');
                    if (el) {
                        el.querySelector('.title').textContent = chat.title;
                        chatTitle.textContent = chat.title;
                    }
                }
            }

            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.classList.remove('visible');
            isGenerating = true;
            stopBtn.classList.add('active');

            const loadingWrapper = appendMessageToContainer('', 'bot', true);

            try {
                // Phase 2: replace with real API call
                await new Promise(function(resolve) { setTimeout(resolve, 1500); });
                const fakeResponse = "This is a demo response. In Phase 2, we'll connect to real AI via Cloudflare Worker with Groq and Gemini, giving you full intelligence and web search capabilities.";
                if (loadingWrapper) loadingWrapper.remove();
                appendMessageToContainer(fakeResponse, 'bot', false);
                if (chat) chat.messages.push({ role: 'bot', text: fakeResponse });
            } catch (error) {
                if (loadingWrapper) loadingWrapper.remove();
                appendMessageToContainer('Sorry, an error occurred. Please try again.', 'bot', false);
                if (chat) chat.messages.push({ role: 'bot', text: 'Sorry, an error occurred. Please try again.' });
            }

            isGenerating = false;
            stopBtn.classList.remove('active');
            userInput.focus();
        }

        function stopGeneration() {
            if (isGenerating) {
                isGenerating = false;
                stopBtn.classList.remove('active');
                if (currentLoadingElement) {
                    const bubble = currentLoadingElement.querySelector('.message-bubble');
                    if (bubble) bubble.textContent = 'Generation stopped.';
                    currentLoadingElement.dataset.loading = 'false';
                    currentLoadingElement = null;
                }
            }
        }

        stopBtn.addEventListener('click', stopGeneration);

        // ============================================================
        // INPUT HANDLING (Send button visibility)
        // ============================================================
        userInput.addEventListener('input', function() {
            const hasText = this.value.trim().length > 0;
            sendBtn.classList.toggle('visible', hasText);
            // Auto-resize
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Click send
        sendBtn.addEventListener('click', sendMessage);

        // ============================================================
        // NEW CHAT
        // ============================================================
        newChatBtn.addEventListener('click', function() {
            const newId = createChat('New Chat');
            addChatToHistory(newId);
            switchChat(newId);
            userInput.focus();
            if (window.innerWidth <= 992) closeSidebar();
        });

        // ============================================================
        // FILE UPLOAD
        // ============================================================
        fileUploadBtn.addEventListener('click', function() {
            fileInput.click();
        });
        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                // Phase 2: handle actual upload
                const names = Array.from(this.files).map(function(f) { return f.name; }).join(', ');
                appendMessageToContainer('📎 Uploaded: ' + names, 'user', false);
                if (currentChatId && chatHistoryData[currentChatId]) {
                    chatHistoryData[currentChatId].messages.push({ role: 'user', text: '📎 Uploaded: ' + names });
                }
                this.value = '';
            }
        });

        // ============================================================
        // SUGGESTIONS
        // ============================================================
        document.querySelectorAll('.suggestions button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                userInput.value = this.dataset.suggestion;
                userInput.dispatchEvent(new Event('input'));
                sendMessage();
            });
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                userInput.focus();
            }
            if (e.key === 'Escape') {
                if (window.innerWidth <= 992 && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
                if (modal.classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        console.log('🌾 AgriDeepAI — Phase 1 Complete (Modern UI)');
        console.log('📋 Features: sidebar, chat history, edit, copy, share, pin, delete, like/dislike, file upload, account modal');
        console.log('🔜 Phase 2: Connect to Cloudflare Worker + Groq/Gemini AI.');
        updateToggleButtonVisibility();
    </script>

</body>
</html>
