        // Use a different variable name to avoid conflict with the global 'supabase' from the SDK
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // 2. APP STATE
        // ============================================================
        const state = {
            user: null,
            session: null,
            conversations: {},
            activeId: null,
            isGenerating: false,
            abortController: null,
            theme: 'dark',
            enterToSend: true,
            selectedModel: 'groq/compound-mini',
            temperature: 0.7,
            webSearchEnabled: true,
            userScrolledUp: false,
            dropdownOpen: false,
            attachments: [],
        };

        // ============================================================
        // 3. DOM REFS (shortcut)
        // ============================================================
        const $ = id => document.getElementById(id);
        // ... (all your existing DOM refs – keep them exactly)

        // ============================================================
        // 4. TOAST, MODAL HELPERS (unchanged)
        // ============================================================
        // ... (keep your showToast, openModal, closeModal, etc.)

        // ============================================================
        // 5. STORAGE (localStorage)
        // ============================================================
        const Storage = {
            get(key) {
                try {
                    const raw = localStorage.getItem('agrideepai_' + key);
                    return raw ? JSON.parse(raw) : null;
                } catch { return null; }
            },
            set(key, value) {
                try { localStorage.setItem('agrideepai_' + key, JSON.stringify(value)); } catch {}
            },
            remove(key) { localStorage.removeItem('agrideepai_' + key); }
        };

        // ============================================================
        // 6. UI UPDATE
        // ============================================================
        function updateUIForUser(user) {
            if (user) {
                const name = user.user_metadata?.name || user.email?.split('@')[0] || 'User';
                if (avatarDisplay) avatarDisplay.textContent = name.charAt(0).toUpperCase();
                if (userNameDisplay) userNameDisplay.textContent = name;
                if (userSubDisplay) userSubDisplay.textContent = user.email || 'signed in';
                if (settingsIcon) settingsIcon.style.display = 'block';
            } else {
                if (avatarDisplay) avatarDisplay.textContent = '👤';
                if (userNameDisplay) userNameDisplay.textContent = 'Sign In';
                if (userSubDisplay) userSubDisplay.textContent = 'Click to sign in';
                if (settingsIcon) settingsIcon.style.display = 'none';
            }
        }

        // ============================================================
        // 7. CONVERSATIONS CRUD (using supabaseClient)
        // ============================================================
        async function loadConversations(userId) {
            if (!userId) return;
            const { data, error } = await supabaseClient
                .from('conversations')
                .select('*')
                .eq('user_id', userId)
                .order('updated_at', { ascending: false });
            if (error) {
                console.error('loadConversations error:', error);
                showToast('Failed to load conversations', 'error');
                return;
            }
            const convs = {};
            for (const row of data) {
                convs[row.id] = {
                    id: row.id,
                    title: row.title || 'New Chat',
                    messages: row.messages || [],
                    pinned: row.pinned || false,
                    created_at: row.created_at,
                    updated_at: row.updated_at,
                };
            }
            state.conversations = convs;
            renderHistory();
            const ids = Object.keys(convs);
            if (ids.length === 0) {
                newChat();
            } else {
                const latest = ids.sort((a,b) => new Date(convs[b].updated_at) - new Date(convs[a].updated_at))[0];
                switchConversation(latest);
            }
        }

        async function saveConversation(convId) {
            const conv = state.conversations[convId];
            if (!conv || !state.user) return;
            const { error } = await supabaseClient
                .from('conversations')
                .upsert({
                    id: convId,
                    user_id: state.user.id,
                    title: conv.title,
                    messages: conv.messages,
                    pinned: conv.pinned,
                    updated_at: new Date().toISOString(),
                }, { onConflict: 'id' });
            if (error) {
                console.error('save error:', error);
                showToast('Failed to save conversation', 'error');
            }
        }

        async function deleteConversation(convId) {
            if (!state.user) return;
            const { error } = await supabaseClient
                .from('conversations')
                .delete()
                .eq('id', convId);
            if (error) {
                console.error('delete error:', error);
                showToast('Failed to delete', 'error');
                return;
            }
            delete state.conversations[convId];
            if (state.activeId === convId) {
                state.activeId = null;
                clearMessages();
                renderHistory();
                if (Object.keys(state.conversations).length === 0) newChat();
            }
            renderHistory();
            showToast('Conversation deleted.', 'info');
        }

        // ============================================================
        // 8. AUTH FUNCTIONS (using supabaseClient)
        // ============================================================
        async function handleSignUp(email, password, name) {
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: { name: name || email.split('@')[0] }
                }
            });
            if (error) throw new Error(error.message);
            showToast('Verification email sent! Please check your inbox.', 'success');
            closeModal(authModal);
            return data;
        }

        async function handleSignIn(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw new Error(error.message);
            return data;
        }

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
        }

        // ============================================================
        // 9. AUTH STATE LISTENER
        // ============================================================
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                state.session = session;
                state.user = session?.user || null;
                updateUIForUser(state.user);
                if (state.user) {
                    loadConversations(state.user.id);
                }
                closeModal(authModal);
            } else if (event === 'SIGNED_OUT') {
                state.session = null;
                state.user = null;
                state.conversations = {};
                state.activeId = null;
                updateUIForUser(null);
                clearMessages();
                renderHistory();
                showToast('Signed out.', 'info');
                if (emptyState) emptyState.classList.remove('is-hidden');
                if (chatTitle) chatTitle.textContent = APP_CONFIG.name;
            }
        });

        // ============================================================
        // 10. AUTH MODAL EVENTS (rewired)
        // ============================================================
        let authMode = 'signin';

        function openAuthModal(mode = 'signin') {
            authMode = mode;
            authError.textContent = '';
            authError.classList.remove('is-visible');
            authName.value = '';
            authEmail.value = '';
            authPassword.value = '';
            authConfirmPassword.value = '';
            authCode.value = '';
            authNameField.style.display = mode === 'signup' ? 'block' : 'none';
            authConfirmField.style.display = mode === 'signup' ? 'block' : 'none';
            authCodeField.style.display = 'none'; // no longer used
            if (mode === 'signin') {
                authModalTitle.textContent = 'Sign In';
                authModalDesc.textContent = 'Sign in to save your chats across devices.';
                authSubmitBtn.textContent = 'Sign In';
                authSwitchBtn.textContent = 'Create Account';
            } else {
                authModalTitle.textContent = 'Create Account';
                authModalDesc.textContent = 'Join AgriDeepAI to save your chats.';
                authSubmitBtn.textContent = 'Sign Up';
                authSwitchBtn.textContent = 'Already have an account? Sign In';
            }
            openModal(authModal);
        }

        // Event listeners
        authSubmitBtn.addEventListener('click', async function() {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            if (!email || !password) {
                showToast('Email and password required.', 'error');
                return;
            }
            if (authMode === 'signup') {
                const name = authName.value.trim() || 'User';
                const confirm = authConfirmPassword.value.trim();
                if (password !== confirm) {
                    showToast('Passwords do not match.', 'error');
                    return;
                }
                // Optional: password strength check (keep your own)
                try {
                    await handleSignUp(email, password, name);
                } catch (err) {
                    showToast('Sign-up error: ' + err.message, 'error');
                }
            } else {
                try {
                    await handleSignIn(email, password);
                } catch (err) {
                    showToast('Sign-in error: ' + err.message, 'error');
                }
            }
        });

        authSwitchBtn.addEventListener('click', function() {
            openAuthModal(authMode === 'signin' ? 'signup' : 'signin');
        });

        authGuestBtn.addEventListener('click', function() {
            closeModal(authModal);
            showToast('Continuing as guest. Chats will not be synced.', 'info');
            supabaseClient.auth.signOut();
        });

        authModalClose.addEventListener('click', () => closeModal(authModal));
        authModal.addEventListener('click', function(e) {
            if (e.target === this) closeModal(authModal);
        });

        // Auth button in sidebar
        authBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (state.user) {
                if (state.dropdownOpen) closeDropdown();
                else openDropdown();
            } else {
                openAuthModal('signin');
            }
        });

        // Dropdown
        function openDropdown() {
            state.dropdownOpen = true;
            accountDropdown.classList.add('is-open');
        }

        function closeDropdown() {
            state.dropdownOpen = false;
            accountDropdown.classList.remove('is-open');
        }

        document.addEventListener('click', function(e) {
            if (state.dropdownOpen && accountDropdown && !accountDropdown.contains(e.target) && e.target !== authBtn) {
                closeDropdown();
            }
        });

        accountDropdown.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', function() {
                const action = this.dataset.action;
                closeDropdown();
                if (!state.user) {
                    showToast('Please sign in first.', 'warning');
                    openAuthModal('signin');
                    return;
                }
                switch (action) {
                    case 'profile':
                        if (state.user) {
                            profileName.value = state.user.user_metadata?.name || '';
                            profileEmail.value = state.user.email || '';
                            openModal(profileModal);
                        }
                        break;
                    case 'account':
                        openModal(accountSettingsModal);
                        break;
                    case 'settings':
                        openModal(settingsModal);
                        break;
                    case 'logout':
                        openConfirmModal('Logout', 'Logout from your account?', async function() {
                            await handleSignOut();
                            closeDropdown();
                        });
                        break;
                }
            });
        });

        settingsIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            if (state.user) {
                if (state.dropdownOpen) closeDropdown();
                else openDropdown();
            } else {
                openAuthModal('signin');
            }
        });

        // ============================================================
        // 11. CHAT FUNCTIONS – keep your existing ones, but ensure
        //     saveConversation is called after each message addition.
        // ============================================================
        // PASTE YOUR ENTIRE CHAT LOGIC HERE (renderConversation, appendUserMessage,
        // appendAssistantMessage, sendMessage, scroll, input, etc.)
        // I'll summarise the critical changes:

        // In sendMessage, after adding user message:
        //   const userMsg = addMessage(conv.id, 'user', fullText);
        //   appendUserMessage(fullText);
        //   await saveConversation(conv.id);  // <-- ADD THIS

        // After receiving AI response:
        //   const botMsg = addMessage(conv.id, 'assistant', aiResponse);
        //   appendAssistantMessage(botMsg.id, aiResponse, false);
        //   await saveConversation(conv.id);  // <-- ADD THIS

        // In edit function, after updating message, also call saveConversation.

        // ============================================================
        // 12. SETTINGS, SIDEBAR, ATTACHMENTS – keep as they are
        // ============================================================

        // ============================================================
        // 13. INIT
        // ============================================================
        async function init() {
            loadSettings();
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (session) {
                state.session = session;
                state.user = session.user;
                updateUIForUser(state.user);
                await loadConversations(state.user.id);
            } else {
                updateUIForUser(null);
                state.conversations = {};
                state.activeId = null;
                renderHistory();
                newChat();
            }
            loadFromURL();
            setInterval(() => {
                if (state.user && state.activeId) {
                    saveConversation(state.activeId);
                }
            }, 10000);
            console.log('🌾 AgriDeepAI initialized.');
        }

        // ============================================================
        // 14. START THE APP
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
