        // ============================================================
        // ATTACHMENTS
        // ============================================================
        let attachments = [];

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                const files = Array.from(this.files);
                files.forEach(file => {
                    if (file.size > APP_CONFIG.maxFileSize) {
                        showToast(`File "${file.name}" exceeds size limit.`, 'error');
                        return;
                    }
                    // Check type
                    const isValid = APP_CONFIG.allowedFileTypes.some(t => {
                        if (t.endsWith('/*')) {
                            return file.type.startsWith(t.replace('/*', ''));
                        }
                        return file.name.endsWith(t.replace('.', ''));
                    });
                    if (!isValid) {
                        showToast(`File type not supported: "${file.name}"`, 'error');
                        return;
                    }
                    attachments.push(file);
                    renderAttachmentPreviews();
                });
                this.value = '';
            }
        });

        function renderAttachmentPreviews() {
            attachmentPreviews.innerHTML = '';
            attachments.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'attachment-preview';
                const isImage = file.type.startsWith('image/');
                div.innerHTML = `
                    ${isImage ? `<img src="${URL.createObjectURL(file)}" alt="${file.name}" />` : `<span class="file-icon">📄</span>`}
                    <span class="file-name">${file.name}</span>
                    <button class="remove-attachment" data-index="${index}" aria-label="Remove attachment">✕</button>
                `;
                div.querySelector('.remove-attachment').addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    attachments.splice(idx, 1);
                    renderAttachmentPreviews();
                });
                attachmentPreviews.appendChild(div);
            });
        }

        // ============================================================
        // VOICE INPUT
        // ============================================================
        let isListening = false;
        let recognition = null;

        if (APP_CONFIG.enableVoice && 'webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                microphoneBtn.textContent = '🔴';
                microphoneBtn.title = 'Listening...';
                showToast('Listening...', 'info');
            };

            recognition.onend = function() {
                isListening = false;
                microphoneBtn.textContent = '🎤';
                microphoneBtn.title = 'Voice input';
            };

            recognition.onresult = function(event) {
                let final = '';
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += transcript;
                    } else {
                        interim += transcript;
                    }
                }
                if (final) {
                    userInput.value = final;
                    userInput.dispatchEvent(new Event('input'));
                    sendMessage();
                } else if (interim) {
                    userInput.value = interim;
                    userInput.dispatchEvent(new Event('input'));
                }
            };

            recognition.onerror = function(event) {
                showToast('Voice error: ' + event.error, 'error');
                isListening = false;
                microphoneBtn.textContent = '🎤';
                microphoneBtn.title = 'Voice input';
            };
        }

        microphoneBtn.addEventListener('click', function() {
            if (!APP_CONFIG.enableVoice) {
                showToast('Voice input is disabled.', 'warning');
                return;
            }
            if (!recognition) {
                showToast('Voice input is not supported in this browser.', 'warning');
                return;
            }
            if (isListening) {
                recognition.stop();
                isListening = false;
                microphoneBtn.textContent = '🎤';
                microphoneBtn.title = 'Voice input';
            } else {
                recognition.start();
            }
        });

        // ============================================================
        // SUGGESTIONS
        // ============================================================
        document.querySelectorAll('.suggestions button').forEach(btn => {
            btn.addEventListener('click', function() {
                const text = this.dataset.suggestion;
                if (text) {
                    userInput.value = text;
                    userInput.dispatchEvent(new Event('input'));
                    sendMessage();
                }
            });
        });

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            // Ctrl/Cmd + K -> focus input
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                userInput.focus();
            }
            // Escape to close modals
            if (e.key === 'Escape') {
                if (accountModal.classList.contains('active')) closeModal(accountModal);
                if (settingsModal.classList.contains('active')) closeModal(settingsModal);
                if (window.innerWidth <= 992 && sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            }
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        function init() {
            // Load settings
            loadSettings();

            // Load conversations from storage
            const savedConvs = Storage.get('conversations');
            if (savedConvs && APP_CONFIG.enableLocalStorage) {
                state.conversations = savedConvs;
                const convs = Object.values(state.conversations);
                if (convs.length > 0) {
                    // Find most recent
                    const latest = convs.sort((a, b) => b.updatedAt - a.updatedAt)[0];
                    state.currentConversationId = latest.id;
                    updateChatHistory();
                    renderConversation(latest.id);
                    chatTitle.textContent = latest.title;
                    if (latest.messages.length > 0) emptyState.classList.add('hidden');
                }
            }

            // Autosave conversations on change
            if (APP_CONFIG.enableLocalStorage) {
                // Save periodically
                setInterval(() => {
                    if (Object.keys(state.conversations).length > 0) {
                        Storage.set('conversations', state.conversations);
                    }
                }, 5000);
            }

            console.log(`🌾 ${APP_CONFIG.appName} v${APP_CONFIG.appVersion} initialized.`);
            console.log('📋 Features: chat, voice, attachments, settings, themes, modals.');
            console.log('🔜 Phase 2: Connect to real AI backend.');
        }

        // Save conversations on page unload
        window.addEventListener('beforeunload', function() {
            if (Object.keys(state.conversations).length > 0) {
                Storage.set('conversations', state.conversations);
            }
        });

        // Start
        init();
    </script>

</body>
</html>
