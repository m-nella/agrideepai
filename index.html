                    return raw ? JSON.parse(raw) : null;
                } catch { return null; }
            },
            set(key, value) {

        // ==========================================================
        // TOAST SYSTEM
        // ==========================================================
        function showToast(message, type = 'info', duration = 3000) {
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.className = 'toast is-' + type;
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                <span class="toast-msg">${message}</span>
                <button class="toast-dismiss" aria-label="Dismiss">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            `;
            toastContainer.appendChild(toast);
            toast.querySelector('.toast-dismiss').addEventListener('click', () => dismissToast(toast));
            setTimeout(() => dismissToast(toast), duration);
        }

        function dismissToast(toast) {
            toast.classList.add('is-hiding');
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
        }

            if (modal) modal.classList.add('is-active');
        }

        function closeModal(modal) {
            if (modal) modal.classList.remove('is-active');
        }

        function openShareModal(title, desc, link, note = 'Anyone with the link can view this content.') {
            if (!shareModal) return;
            shareModalTitle.textContent = title;

            openModal(confirmModal);

        // ==========================================================
        // AUTH SYSTEM (using supabaseClient)
        // ==========================================================
        let authMode = 'signin'; // 'signin', 'signup', 'confirm'

        async function initAuth() {
            if (!supabaseAvailable || !supabaseClient) {
                console.log('🔓 Supabase not available. Running in guest mode.');
                state.isAuthenticated = false;
                state.user = null;
                updateUIForUser(null);
                return;
            }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    state.user = session.user;
                    state.isAuthenticated = true;
                    updateUIForUser(session.user);
                    await loadUserConversations(session.user.id);
                } else {
                    state.isAuthenticated = false;
                    state.user = null;
                    updateUIForUser(null);
                }
            } catch (e) {
                console.warn('⚠️ Auth init error:', e.message);
                state.isAuthenticated = false;
                state.user = null;
                updateUIForUser(null);
            }
        }

        function updateUIForUser(user) {
            if (user) {
                const name = user.user_metadata?.full_name || user.email?.split('@')[0] || 'User';
                avatarDisplay.textContent = name.charAt(0).toUpperCase();
                userNameDisplay.textContent = name;
                userSubDisplay.textContent = user.email || 'signed in';
                if (settingsIcon) settingsIcon.style.display = 'block';
            } else {
                avatarDisplay.textContent = '👤';
                userNameDisplay.textContent = 'Sign In';
                userSubDisplay.textContent = 'Click to sign in';
                if (settingsIcon) settingsIcon.style.display = 'none';
            }
        }

        async function loadUserConversations(userId) {
            if (!supabaseAvailable || !supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('conversations')
                    .select('*')
                    .eq('user_id', userId)
                    .order('updated_at', { ascending: false });
                if (error) {
                    console.error('Error loading conversations:', error);
                    return;
                }
                const convs = {};
                for (const row of data) {
                    convs[row.id] = {
                        id: row.id,
                        title: row.title,
                        messages: row.messages || [],
                        createdAt: row.created_at,
                        updatedAt: row.updated_at,
                        pinned: row.pinned || false,
                    };
                }
                state.conversations = convs;
                if (typeof renderHistory === 'function') renderHistory();
                const ids = Object.keys(convs);
                if (ids.length > 0) {
                    const latest = ids.sort((a, b) => new Date(convs[b].updatedAt) - new Date(convs[a].updatedAt))[0];
                    if (typeof switchConversation === 'function') switchConversation(latest);
                } else {
                    if (typeof newChat === 'function') newChat();
                }
            } catch (e) {
                console.warn('⚠️ Error loading conversations:', e.message);
            }
        }

        async function saveConversationToSupabase(convId) {
            if (!supabaseAvailable || !supabaseClient || !state.isAuthenticated) return;
            const conv = state.conversations[convId];
            if (!conv) return;
            try {
                const { error } = await supabaseClient
                    .from('conversations')
                    .upsert({
                        id: convId,
                        user_id: state.user.id,
                        title: conv.title,
                        messages: conv.messages,
                        pinned: conv.pinned || false,
                        updated_at: new Date().toISOString(),
                    }, { onConflict: 'id' });
                if (error) console.error('Error saving conversation:', error);
            } catch (e) { console.warn('⚠️ Save error:', e.message); }
        }

        async function deleteConversationFromSupabase(convId) {
            if (!supabaseAvailable || !supabaseClient || !state.isAuthenticated) return;
            try {
                const { error } = await supabaseClient
                    .from('conversations')
                    .delete()
                    .eq('id', convId);
                if (error) console.error('Error deleting conversation:', error);
            } catch (e) { console.warn('⚠️ Delete error:', e.message); }
        }

        // Authentication functions
        async function signUp(email, password, name) {
            if (!supabaseAvailable || !supabaseClient) {
                showToast('Supabase is not configured. Please check your connection.', 'error');
                return false;
            }
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { full_name: name },
                    }
                });
                if (error) {
                    showToast('Sign up error: ' + error.message, 'error');
                    return false;
                }
                if (data.user && data.user.confirmation_sent_at) {
                    showToast('Verification email sent. Please check your inbox.', 'success');
                    authMode = 'confirm';
                    if (authModalTitle) authModalTitle.textContent = 'Confirm Email';
                    if (authModalDesc) authModalDesc.textContent = 'Enter the confirmation code sent to your email.';
                    if (authSubmitBtn) authSubmitBtn.textContent = 'Confirm';
                    if (authSwitchBtn) authSwitchBtn.style.display = 'none';
                    if (authNameField) authNameField.style.display = 'none';
                    if (authConfirmField) authConfirmField.style.display = 'none';
                    if (authCodeField) authCodeField.style.display = 'block';
                    if (authError) authError.classList.remove('is-visible');
                    return true;
                }
                return true;
            } catch (e) {
                showToast('Sign up error: ' + e.message, 'error');
                return false;
            }
        }

        async function signIn(email, password) {
            if (!supabaseAvailable || !supabaseClient) {
                showToast('Supabase is not configured. Please check your connection.', 'error');
                return false;
            }
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password,
                });
                if (error) {
                    showToast('Sign in error: ' + error.message, 'error');
                    return false;
                }
                if (data.user) {
                    state.user = data.user;
                    state.isAuthenticated = true;
                    updateUIForUser(data.user);
                    closeModal(authModal);
                    showToast('Signed in successfully!', 'success');
                    await loadUserConversations(data.user.id);
                    return true;
                }
                return false;
            } catch (e) {
                showToast('Sign in error: ' + e.message, 'error');
                return false;
            }
        }

        async function confirmEmail(code) {
            if (!supabaseAvailable || !supabaseClient) {
                showToast('Supabase is not configured.', 'error');
                return false;

                const { data, error } = await supabaseClient.auth.verifyOtp({
                    email: authEmail.value.trim(),

                    type: 'signup',

                    return true;
                }
                return false;
            } catch (e) {
                showToast('Confirmation error: ' + e.message, 'error');
                return false;
            }
        }

        async function signOut() {
            if (!supabaseAvailable || !supabaseClient) {
                state.isAuthenticated = false;
                state.user = null;
                updateUIForUser(null);
                state.conversations = {};
                state.activeId = null;

            try {
                await supabaseClient.auth.signOut();
                state.isAuthenticated = false;

            authSubmitBtn.addEventListener('click', async function() {
                const email = authEmail.value.trim();
                const password = authPassword.value.trim();
                if (!email || !password) {
                    if (authError) {
                        authError.textContent = 'Please fill in all fields.';
                        authError.classList.add('is-visible');
                    }
                    return;
                }
                if (authMode === 'signin') {
                    await signIn(email, password);
                } else if (authMode === 'signup') {
                    const name = authName.value.trim() || 'User';
                    const confirm = authConfirmPassword.value.trim();
                    if (password !== confirm) {
                        if (authError) {
                            authError.textContent = 'Passwords do not match.';
                            authError.classList.add('is-visible');
                        }
                        return;
                    }
                    await signUp(email, password, name);
                } else if (authMode === 'confirm') {
                    const code = authCode.value.trim();
                    if (!code) {
                        if (authError) {
                            authError.textContent = 'Please enter the confirmation code.';
                            authError.classList.add('is-visible');
                        }
                        return;
                    }
                    await confirmEmail(code);
                }
            });
        }

        // ==========================================================
        // SETTINGS
        // ==========================================================
        function loadSettings() {
            const saved = Storage.get('settings');
            if (saved) {
                state.theme = saved.theme || 'dark';
                state.enterToSend = saved.enterToSend !== undefined ? saved.enterToSend : true;
                state.selectedModel = saved.selectedModel || 'groq/compound-mini';
                state.temperature = saved.temperature !== undefined ? saved.temperature : 0.7;
                state.webSearchEnabled = saved.webSearchEnabled !== undefined ? saved.webSearchEnabled : true;
            }
            applyTheme(state.theme);
            if (themeSelect) themeSelect.value = state.theme;
            if (enterSendSelect) enterSendSelect.value = state.enterToSend ? 'true' : 'false';
            if (modelSelect) modelSelect.value = state.selectedModel;
            if (temperatureSlider) temperatureSlider.value = state.temperature;
            if (tempValue) tempValue.textContent = state.temperature;
            if (webSearchToggle) webSearchToggle.checked = state.webSearchEnabled;
        }

        function saveSettings() {
            state.theme = themeSelect.value;
            state.enterToSend = enterSendSelect.value === 'true';
            state.selectedModel = modelSelect.value;
            state.temperature = parseFloat(temperatureSlider.value);
            state.webSearchEnabled = webSearchToggle.checked;
            applyTheme(state.theme);
            Storage.set('settings', {
                theme: state.theme,
                enterToSend: state.enterToSend,
                selectedModel: state.selectedModel,
                temperature: state.temperature,
                webSearchEnabled: state.webSearchEnabled
            });
            closeModal(settingsModal);
            showToast('Settings saved!', 'success');
        }

        function applyTheme(theme) {
            const resolved = theme === 'system' ?
                (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') :
                theme;
            document.documentElement.setAttribute('data-theme', resolved);
            if (theme !== 'system') Storage.set('theme', theme);
            document.querySelectorAll('.response-code-block pre code').forEach(block => {
                hljs.highlightElement(block);
            });
        }

        if (temperatureSlider) {
            temperatureSlider.addEventListener('input', function() {
                if (tempValue) tempValue.textContent = this.value;
            });
        }

        document.addEventListener('keydown', function(e) {
            if (settingsModal && settingsModal.classList.contains('is-active') && e.key === 'Escape') {
                closeModal(settingsModal);
            }
        });

        if (settingsCloseBtn) settingsCloseBtn.addEventListener('click', () => closeModal(settingsModal));
        if (settingsCloseActionBtn) settingsCloseActionBtn.addEventListener('click', () => closeModal(settingsModal));
        if (settingsModal) settingsModal.addEventListener('click', function(e) {
            if (e.target === this) closeModal(settingsModal);
        });
        if (settingsSaveBtn) settingsSaveBtn.addEventListener('click', saveSettings);

        // SIDEBAR
        // ==========================================================
        function toggleSidebar() {
            if (window.innerWidth <= 992) {
                if (sidebar) sidebar.classList.toggle('is-open');
                if (sidebarOverlay) sidebarOverlay.classList.toggle('is-visible');
            } else {
                if (sidebar) sidebar.classList.toggle('is-collapsed');
            }
            const nowCollapsed = sidebar ? sidebar.classList.contains('is-collapsed') : false;
            const svg = sidebarToggle ? sidebarToggle.querySelector('svg') : null;
            if (svg) {
                svg.innerHTML = nowCollapsed ?
                    '<path d="M9 18l6-6-6-6"/>' :
                    '<path d="M15 18l-6-6 6-6"/>';

        }

        function openSidebar() {
            if (window.innerWidth <= 992) {
                if (sidebar) sidebar.classList.add('is-open');
                if (sidebarOverlay) sidebarOverlay.classList.add('is-visible');
            } else {
                if (sidebar) sidebar.classList.remove('is-collapsed');
            }
            const svg = sidebarToggle ? sidebarToggle.querySelector('svg') : null;
            if (svg) svg.innerHTML = '<path d="M15 18l-6-6 6-6"/>';
        }

        function closeSidebar() {
            if (window.innerWidth <= 992) {
                if (sidebar) sidebar.classList.remove('is-open');
                if (sidebarOverlay) sidebarOverlay.classList.remove('is-visible');
            } else {
                if (sidebar) sidebar.classList.add('is-collapsed');

        if (sidebarOpenBtn) sidebarOpenBtn.addEventListener('click', openSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.innerWidth > 992) {
                    if (sidebar) sidebar.classList.remove('is-open');
                    if (sidebarOverlay) sidebarOverlay.classList.remove('is-visible');
                }
            }, 200);
        });

            if (sidebar) sidebar.classList.remove('is-collapsed');
            if (sidebar) sidebar.classList.remove('is-open');
        } else {
            if (sidebar) sidebar.classList.remove('is-collapsed');
        }
        const initSvg = sidebarToggle ? sidebarToggle.querySelector('svg') : null;
        if (initSvg && sidebar && !sidebar.classList.contains('is-collapsed')) {
            initSvg.innerHTML = '<path d="M15 18l-6-6 6-6"/>';

        // ==========================================================
        // CHAT FUNCTIONS
        // ==========================================================
        function genId() { return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); }

        function createConversation(title) {
            const id = 'conv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
            state.conversations[id] = {
                id: id,
                title: title || 'New Chat',
                messages: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                pinned: false,
            };
            return id;
        }

        function getActive() {
            return state.activeId ? state.conversations[state.activeId] : null;
        }

        function addMessage(convId, role, content) {
            const conv = state.conversations[convId];
            if (!conv) return null;
            const msg = { id: genId(), role: role, content: content, createdAt: new Date().toISOString() };
            conv.messages.push(msg);
            conv.updatedAt = new Date().toISOString();
            return msg;
        }

        function switchConversation(id) {
            state.activeId = id;
            renderConversation(id);
            renderHistory();
            const conv = state.conversations[id];
            if (conv && chatTitle) chatTitle.textContent = conv.title;
            if (window.innerWidth <= 992) closeSidebar();
            state.attachments = [];
            renderAttachments();
            state.draft = '';
            if (userInput) userInput.value = '';
            if (userInput) userInput.style.height = 'auto';
            if (sendStopBtn) {
                sendStopBtn.classList.remove('is-active');
                sendStopBtn.classList.remove('is-generating');
                sendStopBtn.disabled = true;
            }
            if (conv && conv.messages.length === 0) {
                if (emptyState) emptyState.classList.remove('is-hidden');
                if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
            } else {
                if (emptyState) emptyState.classList.add('is-hidden');
            }
        }

        function renderConversation(id) {
            const conv = state.conversations[id];
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            wrappers.forEach(el => el.remove());

            if (!conv || conv.messages.length === 0) {
                if (emptyState) emptyState.classList.remove('is-hidden');
                if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
                return;
            }
            if (emptyState) emptyState.classList.add('is-hidden');

            conv.messages.forEach(msg => {
                if (msg.role === 'user') {
                    appendUserMessage(msg.content);
                } else if (msg.role === 'assistant') {
                    appendAssistantMessage(msg.id, msg.content, false);
                }
            });
            updateScrollBtn();
            scrollToBottom(false);
        }

        // ==========================================================
        // USER MESSAGE
        // ==========================================================
        function appendUserMessage(content) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper is-user';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            wrapper.appendChild(bubble);

            const actions = document.createElement('div');
            actions.className = 'message-actions';
            actions.innerHTML = `
                <button data-action="copy" aria-label="Copy" title="Copy">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button data-action="edit" aria-label="Edit" title="Edit">
                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
            `;
            wrapper.appendChild(actions);

            actions.querySelector('[data-action="copy"]').addEventListener('click', function() {
                navigator.clipboard.writeText(content).then(() => {
                    showToast('Copied!', 'success');
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = content;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('Copied!', 'success');
                });
            });
            actions.querySelector('[data-action="edit"]').addEventListener('click', function() {
                startEdit(wrapper, content);
            });

            messagesContainer.appendChild(wrapper);
        }

        function startEdit(wrapper, original) {
            const bubble = wrapper.querySelector('.message-bubble');
            const actions = wrapper.querySelector('.message-actions');
            bubble.style.display = 'none';
            actions.style.display = 'none';

            const editDiv = document.createElement('div');
            editDiv.className = 'edit-container';
            editDiv.innerHTML = `
                <textarea class="edit-input">${original}</textarea>
                <div class="edit-actions">
                    <button class="save-edit">Save</button>
                    <button class="cancel-edit">Cancel</button>
                </div>
            `;
            wrapper.appendChild(editDiv);

            const ta = editDiv.querySelector('.edit-input');
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);

            editDiv.querySelector('.save-edit').addEventListener('click', function() {
                const newText = ta.value.trim();
                if (newText) {
                    const conv = getActive();
                    if (conv) {
                        const msg = conv.messages.find(m => m.content === original && m.role === 'user');
                        if (msg) {
                            msg.content = newText;
                            const idx = conv.messages.indexOf(msg);
                            conv.messages = conv.messages.slice(0, idx + 1);
                            renderConversation(state.activeId);
                            sendMessage(newText);
                        }
                    }
                }
            });

            editDiv.querySelector('.cancel-edit').addEventListener('click', function() {
                bubble.style.display = '';
                actions.style.display = '';
                editDiv.remove();
            });
        }

        // ==========================================================
        // ASSISTANT MESSAGE
        // ==========================================================
        function appendAssistantMessage(messageId, content, isLoading = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper is-bot';
            if (messageId) wrapper.dataset.msgId = messageId;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (isLoading) {
                bubble.innerHTML = `
                    <span style="display:flex;align-items:center;gap:8px;">
                        <span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
                        <span style="font-size:13px;color:var(--text-muted);">Thinking...</span>
                    </span>
                `;
                wrapper.dataset.loading = 'true';
            } else {
                let rawHtml = marked.parse(content);
                const safeHtml = DOMPurify.sanitize(rawHtml, {
                    ALLOWED_TAGS: [
                        'p', 'br', 'strong', 'em', 'i', 'b', 'u', 's', 'strike',
                        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                        'ul', 'ol', 'li', 'blockquote', 'pre', 'code',
                        'a', 'img', 'table', 'thead', 'tbody', 'tr', 'th', 'td',
                        'hr', 'div', 'span'
                    ],
                    ALLOWED_ATTR: ['href', 'target', 'rel', 'src', 'alt', 'class', 'id']
                });
                bubble.innerHTML = safeHtml;

                // Enhance code blocks
                bubble.querySelectorAll('pre code').forEach(codeBlock => {
                    const parentPre = codeBlock.closest('pre');
                    if (!parentPre) return;

                    let lang = 'plaintext';
                    const classList = codeBlock.className.split(' ');
                    for (const cls of classList) {
                        if (cls.startsWith('language-')) {
                            lang = cls.replace('language-', '');
                            break;
                        }
                    }

                    const wrapperDiv = document.createElement('div');
                    wrapperDiv.className = 'response-code-block';

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'response-code-header';
                    headerDiv.innerHTML = `
                        <span class="language-label">${lang}</span>
                        <button class="response-code-copy" data-code="${encodeURIComponent(codeBlock.textContent)}" aria-label="Copy code">
                            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            <span>Copy</span>
                        </button>
                    `;
                    wrapperDiv.appendChild(headerDiv);

                    const newPre = parentPre.cloneNode(true);
                    wrapperDiv.appendChild(newPre);

                    parentPre.parentNode.replaceChild(wrapperDiv, parentPre);

                    const codeEl = wrapperDiv.querySelector('code');
                    if (codeEl && lang !== 'plaintext') {
                        hljs.highlightElement(codeEl);
                    }
                });

                bubble.querySelectorAll('.response-code-copy').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const encoded = this.dataset.code;
                        const code = decodeURIComponent(encoded);
                        navigator.clipboard.writeText(code).then(() => {
                            const label = this.querySelector('span');
                            label.textContent = 'Copied!';
                            this.classList.add('copied');
                            setTimeout(() => {
                                label.textContent = 'Copy';
                                this.classList.remove('copied');
                            }, 1500);
                        }).catch(() => {
                            showToast('Unable to copy code.', 'error');
                        });
                    });
                });
            }

            wrapper.appendChild(bubble);

            // Actions
            const actions = document.createElement('div');
            actions.className = 'message-actions';
            actions.innerHTML = `
                <button data-action="copy" aria-label="Copy" title="Copy">
                    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                </button>
                <button data-action="regenerate" aria-label="Regenerate" title="Regenerate">
                    <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
                <button data-action="like" aria-label="Like" title="Like">
                    <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                </button>
                <button data-action="dislike" aria-label="Dislike" title="Dislike">
                    <svg viewBox="0 0 24 24"><path d="M10 15v3a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
                </button>
                <button data-action="share" aria-label="Share message link" title="Share message link">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </button>
            `;

            actions.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    const msgText = content;
                    const conv = getActive();

                    if (action === 'copy') {
                        navigator.clipboard.writeText(msgText).then(() => {
                            showToast('Copied!', 'success');
                        }).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = msgText;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            showToast('Copied!', 'success');
                        });
                    } else if (action === 'regenerate') {
                        if (conv) {
                            const lastUser = conv.messages.filter(m => m.role === 'user').pop();
                            if (lastUser) {
                                const idx = conv.messages.findIndex(m => m.id === messageId);
                                if (idx > -1) {
                                    conv.messages = conv.messages.slice(0, idx);
                                }
                                renderConversation(state.activeId);
                                sendMessage(lastUser.content);
                            }
                        }
                    } else if (action === 'like') {
                        btn.classList.toggle('is-liked');
                    } else if (action === 'dislike') {
                        btn.classList.toggle('is-disliked');
                    } else if (action === 'share') {
                        const convId = state.activeId;
                        if (convId && messageId) {
                            const url = new URL(window.location.href);
                            url.searchParams.set('conversation', convId);
                            url.searchParams.set('message', messageId);
                            openShareModal(
                                'Share Message',
                                'Share this message with anyone.',
                                url.toString(),
                                'Anyone with the link can view this message.'
                            );
                        }
                    }
                });
            });

            wrapper.appendChild(actions);
            messagesContainer.appendChild(wrapper);
            return wrapper;
        }

        // ==========================================================
        // SCROLL
        // ==========================================================
        if (messagesContainer) {
            messagesContainer.addEventListener('scroll', function() {
                const atBottom = this.scrollHeight - this.scrollTop - this.clientHeight < 20;
                if (atBottom) {
                    state.userScrolledUp = false;
                    if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
                } else {
                    state.userScrolledUp = true;
                    if (state.isGenerating || state.isStreaming) {
                        if (scrollBottomBtn) scrollBottomBtn.classList.add('is-visible');
                    }
                }
            });
        }

        function scrollToBottom(smooth = true) {
            const el = messagesContainer;
            if (!el) return;
            if (smooth) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
            else el.scrollTop = el.scrollHeight;
            state.userScrolledUp = false;
            if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
        }

        if (scrollBottomBtn) {
            scrollBottomBtn.addEventListener('click', () => scrollToBottom(true));
        }

        function updateScrollBtn() {
            if (!messagesContainer) return;
            const atBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 20;
            if (!atBottom && (state.isGenerating || state.isStreaming)) {
                if (scrollBottomBtn) scrollBottomBtn.classList.add('is-visible');
            } else {
                if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
            }
        }

        // ==========================================================
        // SEND MESSAGE
        // ==========================================================
        let attachments = [];

        async function sendMessage(text) {
            if (state.isGenerating) return;
            const message = text || userInput.value.trim();
            if (!message && attachments.length === 0) return;

            let active = getActive();
            if (!state.activeId || (active && active.messages.length === 0)) {
                if (!state.activeId) {
                    const newId = createConversation(message.slice(0, 30) + (message.length > 30 ? '...' : ''));
                    state.activeId = newId;
                    active = getActive();
                }
                renderHistory();
                if (active && chatTitle) chatTitle.textContent = active.title;
                if (emptyState) emptyState.classList.add('is-hidden');
            }

            const conv = getActive();
            if (!conv) return;

            let fullText = message;
            let hasAttachments = attachments.length > 0;
            let attachmentNames = [];
            let fileDataArray = [];

            if (hasAttachments) {
                attachmentNames = attachments.map(f => f.name);
                for (const file of attachments) {
                    const dataUrl = await readFileAsDataURL(file);
                    const parts = dataUrl.split(',');
                    const base64 = parts[1];
                    const mimeType = parts[0].split(':')[1].split(';')[0];
                    fileDataArray.push({
                        name: file.name,
                        type: mimeType,
                        data: base64
                    });
                }
                const note = '📎 Attachments: ' + attachmentNames.join(', ');
                fullText = message ? message + '\n\n' + note : note;
            }

            const userMsg = addMessage(conv.id, 'user', fullText);
            appendUserMessage(fullText);

            if (userInput) {
                userInput.value = '';
                userInput.style.height = 'auto';
            }
            if (sendStopBtn) sendStopBtn.classList.remove('is-active');
            attachments = [];
            renderAttachments();

            if (conv.messages.length === 1) {
                conv.title = message.slice(0, 30) + (message.length > 30 ? '...' : '');
                renderHistory();
                if (chatTitle) chatTitle.textContent = conv.title;
            }

            scrollToBottom(true);

            state.isGenerating = true;
            if (sendStopBtn) {
                sendStopBtn.classList.add('is-generating');
                sendStopBtn.disabled = false;
                sendStopBtn.setAttribute('aria-label', 'Stop generating');
                sendStopBtn.title = 'Stop generating';
            }

            const assistantMsgId = genId();
            const loadingWrapper = appendAssistantMessage(assistantMsgId, '', true);

            state.abortController = new AbortController();

            try {
                const history = conv.messages.slice(0, -1).map(msg => ({
                    role: msg.role,
                    content: msg.content
                }));

                const payload = {
                    message: message,
                    history: history,
                    model: state.selectedModel,
                    temperature: state.temperature,
                    webSearchEnabled: state.webSearchEnabled,
                    userId: state.isAuthenticated ? state.user.id : null,
                };

                if (fileDataArray.length > 0) {
                    payload.files = fileDataArray;
                }

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: state.abortController.signal,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'API request failed');
                }

                const data = await response.json();
                let aiResponse = data.response || 'Sorry, I could not generate a response.';

                if (hasAttachments) {
                    const fileList = attachmentNames.join(', ');
                    aiResponse = `📎 You attached: ${fileList}\n\n` + aiResponse;
                }

                if (loadingWrapper) loadingWrapper.remove();

                const botMsg = addMessage(conv.id, 'assistant', aiResponse);
                appendAssistantMessage(botMsg.id, aiResponse, false);

                if (state.isAuthenticated) {
                    await saveConversationToSupabase(conv.id);
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    if (loadingWrapper) {
                        const bubble = loadingWrapper.querySelector('.message-bubble');
                        if (bubble) bubble.innerHTML = '<span style="color:var(--text-muted);">Generation stopped.</span>';
                        loadingWrapper.dataset.loading = 'false';
                        const actions = loadingWrapper.querySelector('.message-actions');
                        if (actions) actions.remove();
                    }
                    addMessage(conv.id, 'assistant', 'Generation stopped.');
                } else {
                    showToast('Error: ' + error.message, 'error');
                    if (loadingWrapper) {
                        const bubble = loadingWrapper.querySelector('.message-bubble');
                        if (bubble) bubble.innerHTML = '<span style="color:var(--error);">Sorry, an error occurred. Please try again.</span>';
                        loadingWrapper.dataset.loading = 'false';
                        const actions = loadingWrapper.querySelector('.message-actions');
                        if (actions) actions.remove();
                    }
                    addMessage(conv.id, 'assistant', 'Sorry, an error occurred. Please try again.');
                }
            }

            state.isGenerating = false;
            state.isStreaming = false;
            if (sendStopBtn) {
                sendStopBtn.classList.remove('is-generating');
                sendStopBtn.setAttribute('aria-label', 'Send message');
                sendStopBtn.title = 'Send message';
                sendStopBtn.disabled = true;
            }

            renderHistory();
            updateScrollBtn();
            if (!state.userScrolledUp) scrollToBottom(true);
            if (userInput) userInput.focus();
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function stopGeneration() {
            if (state.isGenerating && state.abortController) {
                state.abortController.abort();
                state.isGenerating = false;
                state.isStreaming = false;
                if (sendStopBtn) {
                    sendStopBtn.classList.remove('is-generating');
                    sendStopBtn.setAttribute('aria-label', 'Send message');
                    sendStopBtn.title = 'Send message';
                    sendStopBtn.disabled = true;
                }
                showToast('Generation stopped.', 'info');
            }
        }

        // ==========================================================
        // INPUT HANDLING
        // ==========================================================
        if (userInput) {
            userInput.addEventListener('input', function() {
                const hasText = this.value.trim().length > 0;
                if (hasText || attachments.length > 0) {
                    if (sendStopBtn) {
                        sendStopBtn.classList.add('is-active');
                        sendStopBtn.disabled = false;
                    }
                } else {
                    if (!state.isGenerating && sendStopBtn) {
                        sendStopBtn.classList.remove('is-active');
                        sendStopBtn.disabled = true;
                    }
                }
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 180) + 'px';
            });

            userInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey && state.enterToSend) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        if (sendStopBtn) {
            sendStopBtn.addEventListener('click', function() {
                if (state.isGenerating) {
                    stopGeneration();
                } else {
                    sendMessage();
                }
            });
        }

        // ==========================================================
        // HISTORY
        // ==========================================================
        function renderHistory() {
            const items = chatHistory.querySelectorAll('.chat-item');
            items.forEach(el => el.remove());
            const emptyEl = chatHistory.querySelector('.empty-history');
            if (emptyEl) emptyEl.remove();

            const convs = Object.values(state.conversations);
            if (convs.length === 0) {
                chatHistory.innerHTML = '<div class="empty-history">No chats yet.<br />Start a new conversation.</div>';
                return;
            }

            const pinned = convs.filter(c => c.pinned);
            const unpinned = convs.filter(c => !c.pinned);
            pinned.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            unpinned.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            const sorted = [...pinned, ...unpinned];

            sorted.forEach((conv) => {
                const div = document.createElement('div');
                div.className = 'chat-item' + (conv.id === state.activeId ? ' is-active' : '');
                if (conv.pinned) div.classList.add('is-pinned');
                div.dataset.chatId = conv.id;
                div.innerHTML = `
                    <span class="title">${conv.title}</span>
                    <div class="chat-actions">
                        <button class="${conv.pinned ? 'is-pinned' : ''}" data-action="pin" aria-label="Pin" title="Pin">
                            <svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 12h14"/><path d="M7 12v-5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v5"/></svg>
                        </button>
                        <button data-action="delete" aria-label="Delete" title="Delete">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                        <button data-action="share" aria-label="Share conversation link" title="Share conversation link">
                            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        </button>
                    </div>
                `;
                div.addEventListener('click', function(e) {
                    if (e.target.closest('button')) return;
                    switchConversation(conv.id);
                });
                div.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'delete') {
                            openConfirmModal('Delete Conversation', 'Delete this conversation?', async function() {
                                await deleteConversation(conv.id);
                            });
                        } else if (action === 'pin') {
                            togglePin(conv.id);
                        } else if (action === 'share') {
                            const url = new URL(window.location.href);
                            url.searchParams.set('conversation', conv.id);
                            openShareModal(
                                'Share Conversation',
                                'Share this conversation with anyone.',
                                url.toString(),
                                'Anyone with the link can view this conversation.'
                            );
                        }
                    });
                });
                chatHistory.appendChild(div);
            });
        }

        async function deleteConversation(id) {
            const conv = state.conversations[id];
            if (!conv) return;
            delete state.conversations[id];
            if (state.activeId === id) {
                state.activeId = null;
                if (chatTitle) chatTitle.textContent = APP_CONFIG.name;
                const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
                wrappers.forEach(el => el.remove());
                if (emptyState) emptyState.classList.remove('is-hidden');
                if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
            }
            if (state.isAuthenticated) {
                await deleteConversationFromSupabase(id);
            }
            renderHistory();
            showToast('Conversation deleted.', 'info');
        }

        function togglePin(id) {
            const conv = state.conversations[id];
            if (!conv) return;
            conv.pinned = !conv.pinned;
            renderHistory();
            if (state.activeId) {
                const el = chatHistory.querySelector(`.chat-item[data-chat-id="${state.activeId}"]`);
                if (el) el.classList.add('is-active');
            }
            showToast(conv.pinned ? 'Pinned.' : 'Unpinned.', 'info');
            if (state.isAuthenticated) {
                saveConversationToSupabase(id);
            }
        }

        function newChat() {
            const emptyConv = Object.values(state.conversations).find(c => c.messages.length === 0);
            if (emptyConv) {
                if (state.activeId === emptyConv.id) {
                    if (userInput) userInput.focus();
                    if (window.innerWidth <= 992) closeSidebar();
                    return;
                }
                switchConversation(emptyConv.id);
                if (userInput) userInput.focus();
                if (window.innerWidth <= 992) closeSidebar();
                return;
            }
            const newId = createConversation('New Chat');
            state.activeId = newId;
            const wrappers = messagesContainer.querySelectorAll('.message-wrapper');
            wrappers.forEach(el => el.remove());
            if (emptyState) emptyState.classList.remove('is-hidden');
            if (chatTitle) chatTitle.textContent = 'New Chat';
            renderHistory();
            if (userInput) {
                userInput.focus();
                userInput.value = '';
                userInput.style.height = 'auto';
            }
            if (sendStopBtn) {
                sendStopBtn.classList.remove('is-active');
                sendStopBtn.disabled = true;
                sendStopBtn.classList.remove('is-generating');
            }
            attachments = [];
            renderAttachments();
            if (window.innerWidth <= 992) closeSidebar();
            if (scrollBottomBtn) scrollBottomBtn.classList.remove('is-visible');
        }

        if (newChatBtn) newChatBtn.addEventListener('click', newChat);

        // ==========================================================
        // ATTACHMENTS
        // ==========================================================
        if (attachBtn) attachBtn.addEventListener('click', () => fileInput.click());

        if (fileInput) {
            fileInput.addEventListener('change', function() {
                if (this.files && this.files.length > 0) {
                    const files = Array.from(this.files);
                    files.forEach(file => {
                        if (attachments.length >= APP_CONFIG.maxAttachments) {
                            showToast('Maximum ' + APP_CONFIG.maxAttachments + ' files allowed.', 'warning');
                            return;
                        }
                        if (file.size > APP_CONFIG.maxFileSize) {
                            showToast('File "' + file.name + '" exceeds size limit.', 'error');
                            return;
                        }
                        const isValid = APP_CONFIG.allowedFileTypes.some(t => {
                            if (t.endsWith('/*')) return file.type.startsWith(t.replace('/*', ''));
                            return file.name.endsWith(t.replace('.', ''));
                        });
                        if (!isValid) {
                            showToast('File type not supported: "' + file.name + '"', 'error');
                            return;
                        }
                        attachments.push(file);
                        renderAttachments();
                    });
                    this.value = '';
                    if (userInput.value.trim().length > 0 || attachments.length > 0) {
                        if (sendStopBtn) {
                            sendStopBtn.classList.add('is-active');
                            sendStopBtn.disabled = false;
                        }
                    }
                }
            });
        }

        function renderAttachments() {
            attachmentPreviews.innerHTML = '';
            attachments.forEach((file, index) => {
                const div = document.createElement('div');
                div.className = 'attachment-preview';
                const isImage = file.type.startsWith('image/');
                const url = isImage ? URL.createObjectURL(file) : '';
                div.innerHTML = `
                    ${isImage ? `<img src="${url}" alt="${file.name}" />` : `<span class="file-icon">📄</span>`}
                    <span class="file-name">${file.name}</span>
                    <button class="remove-attach" data-index="${index}" aria-label="Remove attachment">✕</button>
                `;
                div.querySelector('.remove-attach').addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    attachments.splice(idx, 1);
                    renderAttachments();
                    if (userInput.value.trim().length > 0 || attachments.length > 0) {
                        if (sendStopBtn) {
                            sendStopBtn.classList.add('is-active');
                            sendStopBtn.disabled = false;
                        }
                    } else {
                        if (sendStopBtn) {
                            sendStopBtn.classList.remove('is-active');
                            sendStopBtn.disabled = true;
                        }
                    }
                });
                attachmentPreviews.appendChild(div);
            });
        }

        // ==========================================================
        // SUGGESTIONS
        // ==========================================================
        document.querySelectorAll('.suggestions button').forEach(btn => {
            btn.addEventListener('click', function() {
                const text = this.dataset.suggestion;
                if (text) {
                    userInput.value = text;
                    userInput.dispatchEvent(new Event('input'));
                    sendMessage();
                }
            });
        });

        // ==========================================================
        // LOAD FROM URL (sharing)
        // ==========================================================
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const convId = params.get('conversation');
            const msgId = params.get('message');
            if (convId && state.conversations[convId]) {
                switchConversation(convId);
                if (msgId) {
                    setTimeout(() => {
                        const msgEl = messagesContainer.querySelector(`.message-wrapper[data-msg-id="${msgId}"]`);
                        if (msgEl) {
                            msgEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            msgEl.style.transition = 'background 0.3s';
                            msgEl.style.background = 'var(--accent-glow)';
                            setTimeout(() => msgEl.style.background = '', 1500);
                        }
                    }, 400);
                }
            }
        }

        // ==========================================================
        // INIT
        // ==========================================================
        async function init() {
            loadSettings();
            await initAuth();

            if (!state.isAuthenticated && Object.keys(state.conversations).length === 0) {
                state.activeId = null;
                renderHistory();
                renderConversation(null);
                if (chatTitle) chatTitle.textContent = APP_CONFIG.name;
                if (emptyState) emptyState.classList.remove('is-hidden');
            }

            loadFromURL();

            if (state.isAuthenticated) {
                setInterval(() => {
                    const active = getActive();
                    if (active && state.isAuthenticated) {
                        saveConversationToSupabase(active.id);
                    }
                }, 10000);
            }

            console.log('🌾 ' + APP_CONFIG.name + ' v' + APP_CONFIG.version + ' initialized.');
            console.log('📋 Features: Supabase auth, vision/file processing, chat sync, sharing.');
        }

        window.addEventListener('beforeunload', async function() {
            if (state.isAuthenticated) {
                const active = getActive();
                if (active) {
                    await saveConversationToSupabase(active.id);
                }
            }
        });

        init();

        // ==========================================================
        // SHARE MODAL EVENTS
        // ==========================================================
        if (shareModalClose) shareModalClose.addEventListener('click', () => closeModal(shareModal));
        if (shareModalCloseBtn) shareModalCloseBtn.addEventListener('click', () => closeModal(shareModal));
        if (shareModal) shareModal.addEventListener('click', function(e) {
            if (e.target === this) closeModal(shareModal);
        });
        if (shareCopyBtn) {
            shareCopyBtn.addEventListener('click', function() {
                const text = shareLinkInput.value;
                navigator.clipboard.writeText(text).then(() => {
                    showToast('Link copied to clipboard!', 'success');
                    const orig = this.textContent;
                    this.textContent = 'Copied!';
                    setTimeout(() => { this.textContent = orig; }, 2000);
                }).catch(() => {
                    shareLinkInput.select();
                    document.execCommand('copy');
                    showToast('Link copied to clipboard!', 'success');
                    const orig = this.textContent;
                    this.textContent = 'Copied!';
                    setTimeout(() => { this.textContent = orig; }, 2000);
                });
            });
        }

        // ==========================================================
        // CONFIRM MODAL EVENTS
        // ==========================================================
        if (confirmCloseBtn) confirmCloseBtn.addEventListener('click', () => closeModal(confirmModal));
        if (confirmCancelBtn) confirmCancelBtn.addEventListener('click', () => closeModal(confirmModal));
        if (confirmModal) confirmModal.addEventListener('click', function(e) {
            if (e.target === this) closeModal(confirmModal);
        });
        if (confirmOkBtn) {
            confirmOkBtn.addEventListener('click', function() {
                const cb = confirmModal._onConfirm;
                closeModal(confirmModal);
                if (typeof cb === 'function') cb();
            });
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (authModal && authModal.classList.contains('is-active')) closeModal(authModal);
                if (settingsModal && settingsModal.classList.contains('is-active')) closeModal(settingsModal);
                if (profileModal && profileModal.classList.contains('is-active')) closeModal(profileModal);
                if (accountSettingsModal && accountSettingsModal.classList.contains('is-active')) closeModal(accountSettingsModal);
                if (shareModal && shareModal.classList.contains('is-active')) closeModal(shareModal);
                if (confirmModal && confirmModal.classList.contains('is-active')) closeModal(confirmModal);
                if (window.innerWidth <= 992 && sidebar && sidebar.classList.contains('is-open')) {
                    closeSidebar();
                }
            }
            if (e.key === 'Enter' && confirmModal && confirmModal.classList.contains('is-active')) {
                if (confirmOkBtn) confirmOkBtn.click();
            }
        });
    </script>
</body>
</html>
